name: External Admin Secret Hygiene

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/external-admin-secret-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Disable superseded external-token versions
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project millionsnest

          for SECRET in mn-vercel-admin-token mn-cloudflare-dns-token; do
            echo "===== $SECRET ====="
            LATEST="$(gcloud secrets versions list "$SECRET"               --project=millionsnest               --filter='state=enabled'               --sort-by='~name'               --limit=1               --format='value(name)')"
            test -n "$LATEST"
            echo "LATEST_ENABLED=$LATEST"

            gcloud secrets versions list "$SECRET"               --project=millionsnest               --filter='state=enabled'               --format='value(name)'               | while read -r VERSION; do
                  [ -n "$VERSION" ] || continue
                  if [ "$VERSION" != "$LATEST" ]; then
                    echo "Disabling superseded version $VERSION"
                    gcloud secrets versions disable "$VERSION"                       --secret="$SECRET"                       --project=millionsnest                       --quiet
                  fi
                done

            ENABLED_COUNT="$(gcloud secrets versions list "$SECRET"               --project=millionsnest               --filter='state=enabled'               --format='value(name)' | wc -l | tr -d ' ')"
            test "$ENABLED_COUNT" = "1"
            echo "ONLY_LATEST_ENABLED $SECRET"
          done

          echo "EXTERNAL_ADMIN_SECRET_HYGIENE_OK"
