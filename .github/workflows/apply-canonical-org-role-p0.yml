name: Apply Canonical Organization Role P0

on:
  push:
    branches:
      - "feat/canonical-organization-role-p0"
    paths:
      - ".github/workflows/apply-canonical-org-role-p0.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded hardening
        run: python3 scripts/apply_canonical_org_role_p0.py
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' server.ts src/server/services/OrganizationRoleCommandService.ts | sort)"
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/server/services/OrganizationRoleCommandService.ts
          git diff --cached --check
          git commit -m "fix(security): close parallel organization role mutation paths"
          git push origin HEAD:feat/canonical-organization-role-p0
