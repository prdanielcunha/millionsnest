name: NestFinance Firestore Deployer Bootstrap

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/nestfinance-firestore-deployer-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestfinance-firestore-deployer-bootstrap
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Grant NestFinance deployer least-privilege Firestore roles
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="millionsnest"
          MEMBER="serviceAccount:mn-web-deployer@millionsnest.iam.gserviceaccount.com"

          gcloud config set project "$PROJECT_ID"

          for ROLE in roles/firebaserules.admin roles/datastore.indexAdmin; do
            if gcloud projects get-iam-policy "$PROJECT_ID"               --flatten="bindings[].members"               --filter="bindings.role:$ROLE AND bindings.members:$MEMBER"               --format='value(bindings.role)' | grep -Fxq "$ROLE"; then
              echo "Already granted: $ROLE"
            else
              gcloud projects add-iam-policy-binding "$PROJECT_ID"                 --member="$MEMBER"                 --role="$ROLE"                 --condition=None                 --quiet
              echo "Granted: $ROLE"
            fi
          done

      - name: Verify exact bindings
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="millionsnest"
          MEMBER="serviceAccount:mn-web-deployer@millionsnest.iam.gserviceaccount.com"

          for ROLE in roles/firebaserules.admin roles/datastore.indexAdmin; do
            FOUND="$(gcloud projects get-iam-policy "$PROJECT_ID"               --flatten="bindings[].members"               --filter="bindings.role:$ROLE AND bindings.members:$MEMBER"               --format='value(bindings.role)' | head -n1)"
            test "$FOUND" = "$ROLE"
            echo "VERIFIED $ROLE"
          done

          echo "NESTFINANCE_FIRESTORE_DEPLOYER_BOOTSTRAP_OK"
