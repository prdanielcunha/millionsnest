name: Provision Connect Runtime Identity Once

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/provision-connect-runtime-identity-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-runtime-identity-once
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  RUNTIME_SA: mn-connect-runtime@millionsnest.iam.gserviceaccount.com
  DEPLOYER_SA: mn-web-deployer@millionsnest.iam.gserviceaccount.com

jobs:
  provision:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Provision dedicated Connect runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"

          if gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "CONNECT_RUNTIME_IDENTITY_ALREADY_EXISTS"
          else
            gcloud iam service-accounts create mn-connect-runtime \
              --project "$PROJECT_ID" \
              --display-name "MillionsNest Connect Cloud Run Runtime"
            echo "CONNECT_RUNTIME_IDENTITY_CREATED"
          fi

          gcloud iam service-accounts add-iam-policy-binding "$RUNTIME_SA" \
            --project "$PROJECT_ID" \
            --member "serviceAccount:$DEPLOYER_SA" \
            --role roles/iam.serviceAccountUser \
            --quiet >/tmp/connect-runtime-policy.txt

      - name: Verify least-privilege runtime identity
        shell: bash
        run: |
          set -euo pipefail

          gcloud iam service-accounts describe "$RUNTIME_SA" \
            --project "$PROJECT_ID" \
            --format='value(email)' | grep -Fx "$RUNTIME_SA"

          BINDING="$(gcloud iam service-accounts get-iam-policy "$RUNTIME_SA" \
            --project "$PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.role:roles/iam.serviceAccountUser AND bindings.members:serviceAccount:$DEPLOYER_SA" \
            --format='value(bindings.members)' | head -n1)"
          test "$BINDING" = "serviceAccount:$DEPLOYER_SA"

          PROJECT_ROLES="$(gcloud projects get-iam-policy "$PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:$RUNTIME_SA" \
            --format='value(bindings.role)' | sort -u)"
          if [ -n "$PROJECT_ROLES" ]; then
            echo "Unexpected project-level roles on Connect runtime identity:" >&2
            echo "$PROJECT_ROLES" >&2
            exit 1
          fi

          echo "CONNECT_RUNTIME_IDENTITY_READY"
