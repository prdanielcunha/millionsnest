name: Firebase Firestore Rules Deploy
# Canonical shared-rules authority. Emergency redeploy marker: 2026-09-28.

on:
  push:
    branches: [ production ]
    paths:
      - "firestore.rules"
      - "firebase.rules-test.json"
      - "tests/firestore/nestjourney.rules.test.ts"
      - "tests/firestore/musicscale_live.rules.test.ts"
      - "scripts/test_shared_band_rules.ts"
      - "tests/firestore/nestaffiliate.rules.test.ts"
      - ".github/workflows/firebase-firestore-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: millionsnest-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Certify NestJourney Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-nestjourney-release
          "npx tsx --test --test-concurrency=1 tests/firestore/nestjourney.rules.test.ts"

      - name: Certify MusicScale Live Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-musicscale-live-release
          "npx tsx --test --test-concurrency=1 tests/firestore/musicscale_live.rules.test.ts"

      - name: Certify MusicScale band-scale write authorization
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-shared-band-release
          "npx tsx scripts/test_shared_band_rules.ts"

      - name: Certify NestAffiliate Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-nestaffiliate-release
          "npx tsx --test --test-concurrency=1 tests/firestore/nestaffiliate.rules.test.ts"

      - name: Deploy and verify canonical Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          jq -Rs '{
            source: {
              files: [{
                name: "firestore.rules",
                content: .
              }]
            }
          }' firestore.rules >/tmp/ruleset-create.json

          RULESET="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45 -X POST             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/ruleset-create.json             "https://firebaserules.googleapis.com/v1/projects/millionsnest/rulesets")"

          RULESET_NAME="$(jq -r '.name // empty' <<<"$RULESET")"
          test -n "$RULESET_NAME"
          echo "RULESET_CREATED=$RULESET_NAME"

          jq -n --arg name "projects/millionsnest/releases/cloud.firestore" --arg ruleset "$RULESET_NAME" '{
            release: {
              name: $name,
              rulesetName: $ruleset
            },
            updateMask: "rulesetName"
          }' >/tmp/release-update.json

          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45 -X PATCH             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/release-update.json             "https://firebaserules.googleapis.com/v1/projects/millionsnest/releases/cloud.firestore"             >/tmp/release-result.json

          ACTIVE_RULESET="$(jq -r '.rulesetName // empty' /tmp/release-result.json)"
          test "$ACTIVE_RULESET" = "$RULESET_NAME"

          VERIFY="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 45             -H "Authorization: Bearer $ACCESS_TOKEN"             "https://firebaserules.googleapis.com/v1/$RULESET_NAME")"
          SOURCE="$(jq -r '.source.files[]?.content // empty' <<<"$VERIFY")"

          grep -Fq 'function canWriteBandScale(orgId)' <<<"$SOURCE"
          grep -Fq 'function nestAffiliateProductEnabled(orgId)' <<<"$SOURCE"
          grep -Fq "productId != 'raiz_e_mesa' && productId != 'nestaffiliate'" <<<"$SOURCE"
          grep -Fq 'match /products/nestaffiliate' <<<"$SOURCE"
          grep -Fq "'performanceDaily'" <<<"$SOURCE"
          grep -Fq "'affiliateResults'" <<<"$SOURCE"

          echo "MILLIONSNEST_FIRESTORE_RULES_DEPLOY_OK ruleset=$RULESET_NAME"
