name: Firebase Firestore Rules Deploy
# Canonical shared-rules authority. Emergency restoration marker: 2026-10-16.
# Shared live cloud.firestore was overwritten with NestFinance repo-local rules SHA256
# e882bcb5580cc6c3324c86a2cc945f2a4694ed03f5cef052dfb0d89e01bc6371.
# Re-publish unchanged Hub canonical approved rules c8804c9f... via protected
# production QA and verify exact live SHA after publication; never use Finance local rules.

on:
  push:
    branches: [ production ]
    paths:
      - "firestore.rules"
      - "firebase.rules-test.json"
      - "tests/firestore/nestjourney.rules.test.ts"
      - "tests/firestore/musicscale_live.rules.test.ts"
      - "tests/firestore/musicscale_global_curation.rules.test.ts"
      - "tests/firestore/musicscale_medley_templates.rules.test.ts"
      - "scripts/test_shared_band_rules.ts"
      - "tests/firestore/nestaffiliate.rules.test.ts"
      - "tests/firestore/connect_private_storage.test.ts"
      - "tests/firestore/nestfinance_gateway_storage.test.ts"
      - "scripts/verify_connect_rules_compiler.mjs"
      - "scripts/test_connect_rules_compiler.mjs"
      - ".github/workflows/firebase-firestore-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: millionsnest-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compare actual published and candidate cloud compilation without mutations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_connect_rules_compiler.mjs
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          printf '%s' "$ACCESS_TOKEN" | node scripts/verify_connect_rules_compiler.mjs
          unset ACCESS_TOKEN

      - name: Certify NestJourney Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-nestjourney-release
          "npx tsx --test --test-concurrency=1 tests/firestore/nestjourney.rules.test.ts"

      - name: Certify Connect server-owned storage and agent configuration
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-connect-private-store
          "node --import tsx tests/firestore/connect_private_storage.test.ts"

      - name: Certify NestFinance canonical gateway storage
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-finance-gateway
          "node --import tsx tests/firestore/nestfinance_gateway_storage.test.ts"

      - name: Certify MusicScale Live Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-musicscale-live-release
          "npx tsx --test --test-concurrency=1 tests/firestore/musicscale_live.rules.test.ts tests/firestore/musicscale_global_curation.rules.test.ts"

      - name: Certify MusicScale medley template ownership and tenant boundaries
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-musicscale-medley-release
          "npx tsx --test --test-concurrency=1 tests/firestore/musicscale_medley_templates.rules.test.ts"

      - name: Certify MusicScale band-scale write authorization
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-shared-band-release
          "npx tsx scripts/test_shared_band_rules.ts"

      - name: Certify NestAffiliate Firestore boundary
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-nestaffiliate-release
          "npx tsx --test --test-concurrency=1 tests/firestore/nestaffiliate.rules.test.ts"

      - name: Deploy and verify canonical Firestore rules
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          echo "Deploying only shared Firestore Security Rules via Firebase CLI."
          # Use the tested canonical rules source, not a generated/minimal ruleset.
          test -s firestore.rules
          grep -Fq 'match /medleyTemplates/{templateId}' firestore.rules
          grep -Fq 'function canWriteBandScale(orgId)' firestore.rules
          grep -Fq 'function nestAffiliateProductEnabled(orgId)' firestore.rules

          deployed=false
          for attempt in 1 2 3; do
            echo "FIREBASE_CLI_RULES_DEPLOY_ATTEMPT=$attempt"
            if npx firebase deploy --only firestore:rules \
              --config firebase.rules-test.json \
              --project millionsnest --non-interactive; then
              deployed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          if [ "$deployed" != true ]; then
            echo "::error::Firebase CLI could not publish canonical Firestore rules."
            exit 1
          fi

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          BASE_URL="https://firebaserules.googleapis.com/v1/projects/millionsnest"
          echo "Verifying the live cloud.firestore release against the source SHA256."
          for attempt in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "$BASE_URL/releases/cloud.firestore" > /tmp/firestore-release.json; then
              RULESET_NAME="$(jq -r '.rulesetName // empty' /tmp/firestore-release.json)"
              if [ -n "$RULESET_NAME" ] && \
                curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  "https://firebaserules.googleapis.com/v1/$RULESET_NAME" > /tmp/firestore-ruleset.json; then
                jq -j -r '.source.files[] | select(.name == "firestore.rules") | .content' \
                  /tmp/firestore-ruleset.json > /tmp/firestore-live.rules
                if cmp -s firestore.rules /tmp/firestore-live.rules; then
                  echo "MILLIONSNEST_FIRESTORE_RULES_DEPLOY_OK ruleset=$RULESET_NAME"
                  echo "MUSIC_SCALE_MEDLEY_TEMPLATES_LIVE_OK"
                  exit 0
                fi
                echo "::warning::Ruleset returned, but live source differs from canonical rules."
              fi
            fi
            sleep "$((attempt * 5))"
          done
          echo "::error::Firebase CLI ran, but the live Firebase Rules release could not be verified."
          exit 1

      - name: Prove actual published Connect private storage in the production identity
        env:
          CONNECT_LIVE_RULES_FILE: /tmp/firestore-live.rules
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CONNECT_LIVE_RULES_FILE"
          cmp -s firestore.rules "$CONNECT_LIVE_RULES_FILE"
          node -e "const fs=require('fs'),c=require('crypto');console.log('CONNECT_PUBLISHED_RULES_SHA256='+c.createHash('sha256').update(fs.readFileSync(process.env.CONNECT_LIVE_RULES_FILE)).digest('hex'))"
          npx firebase emulators:exec --project demo-connect-private-store --config firebase.rules-test.json --only firestore "node --import tsx tests/firestore/connect_private_storage.test.ts"
          echo CONNECT_ACTUAL_PUBLISHED_PRIVATE_STORAGE_PROOF_OK
