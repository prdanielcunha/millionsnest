name: Action OS Slice 2 CI

on:
  push:
    branches:
      - feature/action-os-slice2-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-os-slice2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck
        run: npm run lint

      - name: Action OS deterministic projection and preferences
        run: npx tsx scripts/test_action_center_projection.ts

      - name: Action OS backend-only Firestore rules
        run: >
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          "npx tsx --test --test-concurrency=1 tests/firestore/action_center.rules.test.ts"

      - name: Hub zero-knowledge UX
        run: npx tsx scripts/test_hub_zero_knowledge_ux.ts

      - name: Premium multi-app Hub responsive contract
        run: npx tsx scripts/test_premium_multi_app_hub.ts

      - name: Hub narrow viewport polish
        run: npx tsx scripts/test_hub_narrow_viewports.ts

      - name: Build
        run: npm run build
