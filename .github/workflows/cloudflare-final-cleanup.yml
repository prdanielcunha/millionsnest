name: Cloudflare Final Cleanup
# execution trigger 2

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/cloudflare-final-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Load Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project=millionsnest)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Validate token and locate zone
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/verify.json
          test "$(jq -r '.success' /tmp/verify.json)" = "true"
          echo "CLOUDFLARE_TOKEN_OK"

          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active" > /tmp/zone.json
          test "$(jq '.result | length' /tmp/zone.json)" = "1"
          ZONE_ID="$(jq -r '.result[0].id' /tmp/zone.json)"
          test -n "$ZONE_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_OK"

      - name: Delete only Vercel TXT leftovers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&per_page=500" > /tmp/txt.json

          jq -r '.result[] | select((.name | ascii_downcase | startswith("_vercel.")) or ((.content // "") | ascii_downcase | contains("vercel"))) | .id'             /tmp/txt.json > /tmp/vercel_ids.txt

          COUNT="$(grep -c . /tmp/vercel_ids.txt || true)"
          echo "VERCEL_TXT_FOUND=$COUNT"

          while IFS= read -r ID; do
            [ -n "$ID" ] || continue
            curl -fsS -X DELETE               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" > /tmp/delete.json
            test "$(jq -r '.success' /tmp/delete.json)" = "true"
            echo "VERCEL_TXT_DELETED"
          done < /tmp/vercel_ids.txt

          echo "CLOUDFLARE_VERCEL_TXT_CLEAN"

      - name: Verify protected DNS
        shell: bash
        run: |
          set -euo pipefail
          test "$(dig +short A millionsnest.com | tail -n1)" = "199.36.158.100"
          test "$(dig +short CNAME www.millionsnest.com | sed 's/\.$//')" = "mn-hub-555464791734.web.app"
          test -n "$(dig +short MX millionsnest.com)"
          test -n "$(dig +short TXT millionsnest.com | grep -i 'v=spf1' || true)"
          echo "MAIL_AND_FIREBASE_DNS_PRESERVED"
