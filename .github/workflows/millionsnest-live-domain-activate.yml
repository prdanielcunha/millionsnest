name: Activate MillionsNest Live Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/millionsnest-live-domain-activate.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: millionsnest-live-official-domain
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: millionsnest
  FIREBASE_SITE: mn-live-555464791734
  LIVE_DOMAIN: live.millionsnest.com

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.26.0

      - name: Ensure dedicated Firebase Hosting site
        shell: bash
        run: |
          set -euo pipefail
          existing="$(firebase hosting:sites:list --project "$FIREBASE_PROJECT")"
          if echo "$existing" | grep -q "$FIREBASE_SITE"; then
            echo "HOSTING_SITE_EXISTS=$FIREBASE_SITE"
          else
            firebase hosting:sites:create "$FIREBASE_SITE" --project "$FIREBASE_PROJECT"
            echo "HOSTING_SITE_CREATED=$FIREBASE_SITE"
          fi

      - name: Authorize Firebase Authentication domains
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CONFIG="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$FIREBASE_PROJECT/config")"

          SITE_DOMAIN="$FIREBASE_SITE.web.app"
          DOMAINS="$(jq -c --arg official "$LIVE_DOMAIN" --arg fallback "$SITE_DOMAIN" \
            '.authorizedDomains + [$official, $fallback] | unique' <<<"$CONFIG")"

          jq -n --argjson domains "$DOMAINS" '{authorizedDomains:$domains}' >/tmp/live-auth.json

          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/live-auth.json \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$FIREBASE_PROJECT/config?updateMask=authorizedDomains" \
            >/dev/null

          echo "FIREBASE_AUTH_DOMAINS_READY"

      - name: Ensure Firebase custom-domain resource
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains"
          STATUS="$(curl --silent --output /tmp/live-domain.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/$LIVE_DOMAIN")"

          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci","product":"millionsnest-live"}}' \
              "$BASE?customDomainId=$LIVE_DOMAIN" >/tmp/live-domain-create.json
            echo "CUSTOM_DOMAIN_CREATED=$LIVE_DOMAIN"
          elif [ "$STATUS" = "200" ]; then
            echo "CUSTOM_DOMAIN_EXISTS=$LIVE_DOMAIN"
          else
            cat /tmp/live-domain.json
            exit 1
          fi

      - name: Read Firebase-required DNS records
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains/$LIVE_DOMAIN"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$URL" >/tmp/live-domain.json

          python3 - "$LIVE_DOMAIN" "$FIREBASE_SITE" <<'PY'
          import json, sys
          from pathlib import Path

          domain = sys.argv[1]
          site = sys.argv[2]
          data = json.loads(Path('/tmp/live-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])

          seen = set()
          lines = []
          for record in desired:
              name = str(record.get('domainName') or '').rstrip('.')
              record_type = str(record.get('type') or '').upper()
              value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
              key = (name, record_type, value)
              if not name or record_type not in {'A', 'AAAA', 'CNAME', 'TXT'} or not value or key in seen:
                  continue
              if not (name == domain or name.endswith('.' + domain)):
                  raise SystemExit(f'Firebase returned out-of-scope DNS name: {name}')
              seen.add(key)
              lines.append('\t'.join(key))

          if not lines and data.get('hostState') == 'HOST_UNHOSTED':
              lines.append('\t'.join((domain, 'CNAME', f'{site}.web.app')))

          Path('/tmp/live-dns.tsv').write_text('\n'.join(lines) + ('\n' if lines else ''))
          print(json.dumps({
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(lines)
          }, sort_keys=True))
          PY

      - name: Apply only MillionsNest Live DNS records in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/live-dns.tsv ]; then
            echo "Firebase requested no DNS changes."
            exit 0
          fi

          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$FIREBASE_PROJECT")"
          echo "::add-mask::$CF_TOKEN"

          ZONES="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue

            case "$NAME" in
              "$LIVE_DOMAIN"|*."$LIVE_DOMAIN") ;;
              *) echo "Refusing out-of-scope DNS mutation: $NAME"; exit 1 ;;
            esac

            EXISTING="$(curl --fail --silent --show-error -G \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-urlencode "name=$NAME" \
              --data-urlencode "type=$TYPE" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"

            MATCH_ID="$(jq -r --arg value "$VALUE" '.result[] | select(.content == $value) | .id' <<<"$EXISTING" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE" \
              '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"

            RECORD_ID="$(jq -r '.result[0].id // empty' <<<"$EXISTING")"
            if [ -n "$RECORD_ID" ] && [ "$TYPE" != "TXT" ]; then
              curl --fail --silent --show-error -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" >/dev/null
            else
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            fi

            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/live-dns.tsv

      - name: Deploy safe bootstrap page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/millionsnest-live-bootstrap
          cat >/tmp/millionsnest-live-bootstrap/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="theme-color" content="#0B0C11">
              <title>MillionsNest Live</title>
              <style>
                html,body{height:100%;margin:0;background:#0B0C11;color:#F4F5F8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
                body{display:grid;place-items:center}.card{width:min(680px,calc(100vw - 48px));padding:36px;border:1px solid rgba(255,255,255,.08);border-radius:24px;background:linear-gradient(160deg,rgba(25,27,36,.94),rgba(12,13,18,.98));box-shadow:0 30px 100px rgba(0,0,0,.35)}
                small{letter-spacing:.18em;color:#A99BFF;font-weight:700}h1{font-size:48px;letter-spacing:-.05em;margin:12px 0}p{color:#9CA1B2;line-height:1.6;margin:0}
              </style>
            </head>
            <body><main class="card"><small>MILLIONSNEST / LIVE</small><h1>MillionsNest Live</h1><p>Infraestrutura oficial preparada. O aplicativo de produção será publicado neste endereço pelo pipeline do produto.</p></main></body>
          </html>
          HTML

          cat >/tmp/firebase-live.json <<JSON
          {
            "hosting": {
              "site": "$FIREBASE_SITE",
              "public": "/tmp/millionsnest-live-bootstrap",
              "cleanUrls": true
            }
          }
          JSON

          firebase deploy --only hosting --config /tmp/firebase-live.json --project "$FIREBASE_PROJECT"
          echo "BOOTSTRAP_DEPLOYED=https://$FIREBASE_SITE.web.app"

      - name: Verify fallback and report custom-domain state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "https://$FIREBASE_SITE.web.app/" >/tmp/live-fallback.html
          grep -Fq 'MillionsNest Live' /tmp/live-fallback.html
          echo "LIVE_FALLBACK_OK"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains/$LIVE_DOMAIN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$URL" | jq '{ownershipState,hostState,reconciling,certState:(.cert.state // null),issues}'
