name: Activate NestLocal Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/nestlocal-domain-activate.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestlocal-official-domain
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Authorize login and ensure Firebase custom domain
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          CONFIG="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            https://identitytoolkit.googleapis.com/admin/v2/projects/millionsnest/config)"
          DOMAINS="$(jq -c '.authorizedDomains + ["nestlocal.millionsnest.com", "nestlocal.web.app", "mn-nestlocal-555464791734.web.app"] | unique' <<<"$CONFIG")"
          jq -n --argjson domains "$DOMAINS" '{authorizedDomains:$domains}' >/tmp/nestlocal-auth.json
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/nestlocal-auth.json \
            'https://identitytoolkit.googleapis.com/admin/v2/projects/millionsnest/config?updateMask=authorizedDomains' \
            >/dev/null

          BASE='https://firebasehosting.googleapis.com/v1beta1/projects/millionsnest/sites/mn-nestlocal-555464791734/customDomains'
          STATUS="$(curl --silent --output /tmp/nestlocal-domain.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/nestlocal.millionsnest.com")"
          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci"}}' \
              "$BASE?customDomainId=nestlocal.millionsnest.com" >/tmp/nestlocal-domain-create.json
          elif [ "$STATUS" != "200" ]; then
            cat /tmp/nestlocal-domain.json
            exit 1
          fi

      - name: Read Firebase-required DNS records
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL='https://firebasehosting.googleapis.com/v1beta1/projects/millionsnest/sites/mn-nestlocal-555464791734/customDomains/nestlocal.millionsnest.com'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$URL" >/tmp/nestlocal-domain.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/nestlocal-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])
          seen = set()
          lines = []
          for record in desired:
              name = str(record.get('domainName') or '').rstrip('.')
              record_type = str(record.get('type') or '').upper()
              value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
              key = (name, record_type, value)
              if not name or record_type not in {'A', 'AAAA', 'CNAME', 'TXT'} or not value or key in seen:
                  continue
              if not (name == 'nestlocal.millionsnest.com' or name.endswith('.nestlocal.millionsnest.com')):
                  raise SystemExit(f'Firebase returned an out-of-scope DNS name: {name}')
              seen.add(key)
              lines.append('\t'.join(key))
          # Firebase occasionally reports HOST_UNHOSTED before populating
          # requiredDnsUpdates for an already-owned parent domain. The isolated
          # Hosting site's canonical CNAME is deterministic and matches the
          # established pattern used by the other MillionsNest subdomains.
          if not lines and data.get('hostState') == 'HOST_UNHOSTED':
              lines.append('\t'.join((
                  'nestlocal.millionsnest.com',
                  'CNAME',
                  'mn-nestlocal-555464791734.web.app',
              )))
          Path('/tmp/nestlocal-dns.tsv').write_text('\n'.join(lines) + ('\n' if lines else ''))
          public = {
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(lines),
          }
          print(json.dumps(public, sort_keys=True))
          PY

      - name: Apply only NestLocal DNS records in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/nestlocal-dns.tsv ]; then
            echo "Firebase requested no DNS changes."
            exit 0
          fi

          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project=millionsnest)"
          ZONES="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue
            EXISTING="$(curl --fail --silent --show-error -G \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-urlencode "name=$NAME" \
              --data-urlencode "type=$TYPE" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"
            MATCH_ID="$(jq -r --arg value "$VALUE" '.result[] | select(.content == $value) | .id' <<<"$EXISTING" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE" \
              '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"
            RECORD_ID="$(jq -r '.result[0].id // empty' <<<"$EXISTING")"
            if [ -n "$RECORD_ID" ] && [ "$TYPE" != "TXT" ]; then
              curl --fail --silent --show-error -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" >/dev/null
            else
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/nestlocal-dns.tsv

      - name: Verify safe public fallback
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 3 --retry-all-errors \
            https://nestlocal.web.app/ >/tmp/nestlocal.html
          grep -Eiq '<!doctype html|<html' /tmp/nestlocal.html
          echo "NESTLOCAL_FALLBACK_OK"
