name: Restore MusicScale Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/musicscale-domain-activate.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: musicscale-official-domain
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Ensure the MusicScale Firebase custom domain
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE='https://firebasehosting.googleapis.com/v1beta1/projects/millionsnest/sites/mn-musicscale-555464791734/customDomains'
          STATUS="$(curl --silent --show-error --output /tmp/ms-domain.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE/musicscale.millionsnest.com")"
          if [ "$STATUS" = 404 ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci"}}' \
              "$BASE?customDomainId=musicscale.millionsnest.com" >/dev/null
            sleep 15
          elif [ "$STATUS" != 200 ]; then
            echo "Firebase custom domain query returned HTTP $STATUS"
            exit 1
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            "$BASE/musicscale.millionsnest.com" >/tmp/ms-domain.json

      - name: Prepare only Firebase-required MusicScale DNS records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          domain = 'musicscale.millionsnest.com'
          data = json.loads(Path('/tmp/ms-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])
          records = set()
          for record in desired:
              name = str(record.get('domainName') or '').rstrip('.')
              kind = str(record.get('type') or '').upper()
              value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
              if not name or not value or kind not in {'A', 'AAAA', 'CNAME', 'TXT'}:
                  continue
              if name != domain and not name.endswith('.' + domain):
                  raise SystemExit('Firebase returned an out-of-scope DNS name')
              records.add((name, kind, value))
          # This site already has an established Firebase Hosting CNAME contract.
          # Restore it when the resource reports no pending DNS updates.
          if not any(name == domain and kind in {'A', 'AAAA', 'CNAME'} for name, kind, _ in records):
              records.add((domain, 'CNAME', 'mn-musicscale-555464791734.web.app'))
          Path('/tmp/ms-dns.tsv').write_text(''.join('\t'.join(x) + '\n' for x in sorted(records)))
          print(json.dumps({
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(records),
          }, sort_keys=True))
          PY

      - name: Replace only loopback MusicScale DNS in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project=millionsnest)"
          ZONES="$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue
            case "$NAME" in
              musicscale.millionsnest.com|*.musicscale.millionsnest.com) ;;
              *) echo 'Refusing out-of-scope DNS mutation'; exit 1 ;;
            esac
            EXISTING="$(curl --fail --silent --show-error -G \
              -H "Authorization: Bearer $CF_TOKEN" --data-urlencode "name=$NAME" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")"
            MATCH_ID="$(jq -r --arg name "$NAME" --arg type "$TYPE" --arg value "$VALUE" \
              '.result[] | select(.name == $name and .type == $type and (.content | rtrimstr(".")) == $value and .proxied != true) | .id' \
              <<<"$EXISTING" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            if [ "$TYPE" = CNAME ]; then
              # A CNAME cannot coexist with A/AAAA. Remove only the observed
              # broken loopback records for this exact hostname.
              CONFLICTS="$(jq -r --arg name "$NAME" \
                '.result[] | select(.name == $name and (.type == "A" or .type == "AAAA")) | [.id,.content] | @tsv' \
                <<<"$EXISTING")"
              while IFS=$'\t' read -r ID CONTENT; do
                test -n "$ID" || continue
                if [ "$CONTENT" != '127.0.0.1' ] && [ "$CONTENT" != '::1' ]; then
                  echo "Refusing to replace a non-loopback $NAME record"
                  exit 1
                fi
                curl --fail --silent --show-error -X DELETE \
                  -H "Authorization: Bearer $CF_TOKEN" \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" >/dev/null
                echo "REMOVED_LOOPBACK name=$NAME"
              done <<<"$CONFLICTS"
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE" \
              '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"
            SAME_TYPE_ID="$(jq -r --arg name "$NAME" --arg type "$TYPE" \
              '.result[] | select(.name == $name and .type == $type) | .id' <<<"$EXISTING" | head -n1)"
            if [ -n "$SAME_TYPE_ID" ] && [ "$TYPE" != TXT ]; then
              curl --fail --silent --show-error -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$SAME_TYPE_ID" >/dev/null
            else
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/ms-dns.tsv

      - name: Verify Firebase fallback and show DNS propagation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://mn-musicscale-555464791734.web.app/ -o /tmp/ms.html
          grep -Eiq '<!doctype html|<html' /tmp/ms.html
          echo 'MUSICSCALE_FIREBASE_FALLBACK_OK'
          echo 'Public parent nameservers:'
          dig +short NS millionsnest.com | sort
          echo 'Cloudflare zone nameservers:'
          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project=millionsnest)"
          ZONES="$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          jq -r '.result[0].name_servers[]?' <<<"$ZONES" | sort
          echo 'Public MusicScale CNAME:'
          dig +short CNAME musicscale.millionsnest.com
          echo 'Public MusicScale A:'
          dig +short A musicscale.millionsnest.com
          echo 'Firebase site through public resolver:'
          dig +short A mn-musicscale-555464791734.web.app
          PUBLIC_NS="$(dig +short NS millionsnest.com | sed 's/\.$//' | sort)"
          CLOUDFLARE_NS="$(jq -r '.result[0].name_servers[]?' <<<"$ZONES" | sed 's/\.$//' | sort)"
          if [ "$PUBLIC_NS" != "$CLOUDFLARE_NS" ]; then
            echo 'DNS_DELEGATION_MISMATCH: Cloudflare zone is not the public DNS authority'
            exit 1
          fi
          if [ "$(dig +short A musicscale.millionsnest.com | tail -n1)" = '127.0.0.1' ]; then
            echo 'DNS_LOOPBACK_STILL_PUBLIC'
            exit 1
          fi
