name: Firebase Web Infrastructure Preflight

on:
  pull_request:
    branches: [ main, production ]
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: millionsnest-firebase-web-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Firebase Web configuration is public by design and is preserved from the current production bundle.
  VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
  VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: millionsnest
  VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
  VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Firebase migration contract
        run: npx tsx scripts/test_firebase_hosting_cloudrun_policy.ts

      - name: Lint and typecheck
        run: npm run lint

      - name: Build production artifacts with the canonical public Firebase app config
        run: npm run build

  google_cloud_read_only:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Attempt existing MillionsNest-project WIF authentication
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/ms-fn-prod-v1/providers/github
          service_account: ms-fn-prod-wif-v1@millionsnest.iam.gserviceaccount.com
          audience: //iam.googleapis.com/projects/555464791734/locations/global/workloadIdentityPools/ms-fn-prod-v1/providers/github

      - name: Read-only infrastructure discovery
        if: steps.auth.outcome == 'success'
        shell: bash
        run: |
          set -u
          echo "Active Google identity:"
          gcloud auth list --filter=status:ACTIVE --format='value(account)' || true
          echo "Enabled APIs relevant to the migration:"
          gcloud services list --enabled --project millionsnest --format='value(config.name)' 2>/dev/null \
            | grep -E '^(run|firebasehosting|artifactregistry|cloudbuild|secretmanager)\.googleapis\.com$' || true
          echo "Existing Cloud Run services in us-central1:"
          gcloud run services list --project millionsnest --region us-central1 --format='value(metadata.name)' 2>/dev/null || true
          echo "Relevant Secret Manager names (values are never read):"
          gcloud secrets list --project millionsnest --format='value(name)' 2>/dev/null \
            | grep -Ei 'millionsnest|stripe|firebase' || true
          echo "Read-only preflight finished. No cloud resource was changed."

      - name: Explain repository-scoped WIF without failing product QA
        if: steps.auth.outcome != 'success'
        run: |
          echo "The existing MusicScale WIF does not authorize this MillionsNest repository context."
          echo "No fallback key was used and no cloud resource was changed."
          echo "A repository-scoped WIF binding will be required before automated production deployment."
