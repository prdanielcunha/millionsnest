name: Church Intelligence Foundation QA

on:
  pull_request:
    branches:
      - production
    paths:
      - 'src/packages/events/**'
      - 'src/packages/i18n/engine.ts'
      - 'src/packages/i18n/intelligence/**'
      - 'src/packages/i18n/locales/es.ts'
      - 'src/packages/i18n/locales/en.ts'
      - 'src/packages/i18n/locales/pt.ts'
      - 'src/lib/actionCenter.ts'
      - 'src/lib/askMillionsNest.ts'
      - 'src/lib/actionResolution.ts'
      - 'src/lib/outcomeEngine.ts'
      - 'src/lib/journeyOutcomeAttestation.ts'
      - 'src/lib/nextBestMinistryAction.ts'
      - 'src/lib/toolGateway.ts'
      - 'src/lib/actionToolGatewayBridge.ts'
      - 'src/lib/actionSignals.ts'
      - 'src/services/actionCenterClient.ts'
      - 'src/server/services/ActionResolutionCommandService.ts'
      - 'src/server/services/ToolGatewayService.ts'
      - 'src/server/services/ToolApprovalCommandService.ts'
      - 'src/server/services/ToolActionIdentity.ts'
      - 'src/lib/toolApproval.ts'
      - 'src/lib/factSignalAdapter.ts'
      - 'src/lib/musicScaleFactProjection.ts'
      - 'src/lib/musicScaleLeaderIntelligence.ts'
      - 'src/lib/musicScaleRepertoireIntelligence.ts'
      - 'src/lib/musicScaleDistributionFactProjection.ts'
      - 'src/lib/musicScaleDistributionIntelligence.ts'
      - 'src/lib/musicScaleChangeFactProjection.ts'
      - 'src/lib/changeCenter.ts'
      - 'src/lib/commitmentCenter.ts'
      - 'src/lib/lensResolver.ts'
      - 'src/lib/hubLensAuthorization.ts'
      - 'src/lib/lensActionProjection.ts'
      - 'src/lib/adaptiveWorkspaceModel.ts'
      - 'src/lib/adaptiveEntitlements.ts'
      - 'src/lib/currentAdaptiveWorkspace.ts'
      - 'src/lib/currentContextGraph.ts'
      - 'src/lib/nestJourneyWorkspaceProjection.ts'
      - 'src/lib/hubAppExperience.ts'
      - 'src/lib/appExperienceRegistry.ts'
      - 'src/services/nestJourneyWorkspaceClient.ts'
      - 'src/server/services/NestJourneyWorkspaceProjectionService.ts'
      - 'src/components/dashboard/HubLensSwitcher.tsx'
      - 'src/components/dashboard/AskMillionsNest.tsx'
      - 'src/components/dashboard/HubAppLaunchpad.tsx'
      - 'src/components/dashboard/ActionResolutionObserver.tsx'
      - 'src/components/dashboard/MusicScaleDistributionSnapshot.tsx'
      - 'src/pages/Dashboard.tsx'
      - 'server.ts'
      - 'src/components/dashboard/EcosystemWorkspaceHome.tsx'
      - 'scripts/test_fact_contract.ts'
      - 'scripts/test_musicscale_fact_stream.ts'
      - 'scripts/test_musicscale_leader_intelligence.ts'
      - 'scripts/test_musicscale_declined_gaps.ts'
      - 'scripts/test_musicscale_distribution_intelligence.ts'
      - 'scripts/test_musicscale_repertoire_intelligence.ts'
      - 'scripts/test_action_resolution_loop.ts'
      - 'scripts/test_outcome_engine.ts'
      - 'scripts/test_journey_outcome_attestation.ts'
      - 'scripts/test_next_best_ministry_action.ts'
      - 'scripts/test_tool_gateway.ts'
      - 'scripts/test_tool_approval_gateway.ts'
      - 'scripts/test_evidence_backed_timeline.ts'
      - 'scripts/test_action_center_evidence_projection.ts'
      - 'scripts/test_lens_resolver.ts'
      - 'scripts/test_hub_lens_authorization.ts'
      - 'scripts/test_lens_action_projection.ts'
      - 'scripts/test_adaptive_workspace_model.ts'
      - 'scripts/test_adaptive_entitlements.ts'
      - 'scripts/test_adaptive_home_integration.ts'
      - 'scripts/test_novice_app_onboarding.ts'
      - 'scripts/test_current_adaptive_workspace.ts'
      - 'scripts/test_current_context_graph.ts'
      - 'scripts/test_intelligence_i18n.ts'
      - 'scripts/test_ask_millionsnest.ts'
      - 'scripts/test_nestjourney_adaptive_hub.ts'
      - 'scripts/test_nestjourney_workspace_projection.ts'
      - '.github/workflows/church-intelligence-foundation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: church-intelligence-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Canonical fact and evidence contract
        run: npx tsx scripts/test_fact_contract.ts

      - name: MusicScale canonical Fact Stream
        run: npx tsx scripts/test_musicscale_fact_stream.ts

      - name: MusicScale leader confirmation-gap intelligence
        run: npx tsx scripts/test_musicscale_leader_intelligence.ts

      - name: MusicScale declined leader-gap intelligence
        run: npx tsx scripts/test_musicscale_declined_gaps.ts

      - name: MusicScale Worship distribution intelligence
        run: npx tsx scripts/test_musicscale_distribution_intelligence.ts

      - name: MusicScale repertoire content intelligence
        run: npx tsx scripts/test_musicscale_repertoire_intelligence.ts

      - name: Action Loop Resolver and factual outcomes
        run: npx tsx scripts/test_action_resolution_loop.ts

      - name: Outcome Engine classification and audit
        run: npx tsx scripts/test_outcome_engine.ts

      - name: Journey server-side outcome attestation
        run: npx tsx scripts/test_journey_outcome_attestation.ts

      - name: Explainable Next Best Ministry Action
        run: npx tsx scripts/test_next_best_ministry_action.ts

      - name: Tool Gateway safety and approvals
        run: npx tsx scripts/test_tool_gateway.ts

      - name: Human Tool Approval lifecycle
        run: npx tsx scripts/test_tool_approval_gateway.ts

      - name: Evidence-backed commitments and changes
        run: npx tsx scripts/test_evidence_backed_timeline.ts

      - name: Evidence-first Action Center projection
        run: npx tsx scripts/test_action_center_evidence_projection.ts

      - name: Adaptive Lens authorization projection
        run: npx tsx scripts/test_lens_resolver.ts

      - name: Current Hub lens authority adapter
        run: npx tsx scripts/test_hub_lens_authorization.ts

      - name: Lens action narrowing projection
        run: npx tsx scripts/test_lens_action_projection.ts

      - name: Adaptive workspace read model
        run: npx tsx scripts/test_adaptive_workspace_model.ts

      - name: Per-product adaptive entitlements
        run: npx tsx scripts/test_adaptive_entitlements.ts

      - name: Adaptive Home entitlement integration
        run: npx tsx scripts/test_adaptive_home_integration.ts

      - name: Novice app onboarding
        run: npx tsx scripts/test_novice_app_onboarding.ts

      - name: Current Hub adaptive workspace bridge
        run: npx tsx scripts/test_current_adaptive_workspace.ts

      - name: Current Hub Context Graph
        run: npx tsx scripts/test_current_context_graph.ts

      - name: Ask MillionsNest evidence and authorization
        run: npx tsx scripts/test_ask_millionsnest.ts

      - name: NestJourney Adaptive Hub evidence and authorization
        run: npx tsx scripts/test_nestjourney_adaptive_hub.ts

      - name: Church Intelligence PT/EN/ES coverage
        run: npx tsx scripts/test_intelligence_i18n.ts

      - name: Typecheck
        run: npx tsc --noEmit
