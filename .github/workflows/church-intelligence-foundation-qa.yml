name: Church Intelligence Foundation QA

on:
  pull_request:
    branches:
      - production
    paths:
      - 'src/packages/events/**'
      - 'scripts/test_fact_contract.ts'
      - '.github/workflows/church-intelligence-foundation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: church-intelligence-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Canonical fact and evidence contract
        run: npx tsx scripts/test_fact_contract.ts

      - name: Typecheck
        run: npx tsc --noEmit
