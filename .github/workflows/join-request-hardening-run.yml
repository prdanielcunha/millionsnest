name: Temporary Join Request Hardening Runner

on:
  push:
    branches:
      - codex/implementar-comandos-canonicos-de-join-request
    paths:
      - .github/workflows/join-request-hardening-run.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: true

      - name: Verify recovery source and extract reviewed patch script
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e23559bf264361d30baf1d73122eb95bddc505d2 HEAD
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/join-request-hardening-temporary.yml').read_text().splitlines()
          marker = '      - name: Apply reviewed security hardening'
          start = source.index(marker)
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - uses: actions/setup-node@v4'))
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-join-hardening.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/apply-join-hardening.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Join request command certification
        run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore --project demo-millionsnest-invitations-p0 "npx tsx scripts/test_p0_join_request_commands_certification.ts"

      - name: Join request and legacy rules certification
        run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore --project demo-millionsnest-rules-p0 "node --import tsx --test tests/firestore/join_requests.rules.test.ts tests/firestore/organization_members.rules.test.ts"

      - name: Invitation regression certification
        run: npx firebase emulators:exec --config firebase.rules-test.json --only firestore --project demo-millionsnest-invitations-p0 "npx tsx scripts/test_p0_invitation_commands_certification.ts && npx tsx scripts/test_p0_invitation_final_certification.ts && npx tsx scripts/test_p0a3_invitation_acceptance_transaction.ts"

      - name: Planner and resolver regressions
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/test_p0a3_invitation_creation_planner.ts
          npx tsx scripts/test_p0a3_invitation_acceptance_planner.ts
          npx tsx scripts/test_p0a3_invitation_redirect_policy.ts
          npx tsx scripts/test_p0a3_invitation_token_service.ts
          npx tsx scripts/test_p0a3_join_client_policy.ts
          npx tsx scripts/test_mn_access_01_musicscale_resolver.ts
          npx tsx scripts/test_mn_access_02_musicscale_handoff.ts
          npx tsx scripts/test_millionsnest_security_governance_p0.ts
          npx tsx scripts/test_p0a2_bootstrap_transaction.ts

      - name: Lint and build
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run build
          git diff --check

      - name: Commit certified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules scripts/test_p0_join_request_commands_certification.ts src/server/services/JoinRequestCommandService.ts tests/firestore/join_requests.rules.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(security): harden canonical join request commands"
          git push origin HEAD:codex/implementar-comandos-canonicos-de-join-request
