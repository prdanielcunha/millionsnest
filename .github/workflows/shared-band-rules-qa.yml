name: Shared MusicScale band rules QA
on:
  pull_request:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "scripts/test_shared_band_rules.ts"
      - "scripts/firebase-band-rules-qa.json"
      - ".github/workflows/shared-band-rules-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Test shared band rules in isolated Firestore emulator
        run: npx firebase-tools@15.26.0 emulators:exec --project demo-millionsnest-shared-band-qa --config scripts/firebase-band-rules-qa.json --only firestore "npx tsx scripts/test_shared_band_rules.ts"
