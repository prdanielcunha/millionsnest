name: Apply Join Request Rules Patch

on:
  push:
    branches:
      - "codex/implementar-comandos-canonicos-de-join-request"
    paths:
      - ".github/workflows/join-request-rules-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch only join request read rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('firestore.rules')
          s = p.read_text()
          pattern = re.compile(r"      match /join_requests/\{requestId\} \{\n.*?        allow create, update, delete: if false;\n      \}", re.S)
          replacement = '''      match /join_requests/{requestId} {
        allow read, list: if isAuthenticated() && (
          isSystemAdmin() ||
          (
            exists(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)) &&
            get(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)).data.get('status', '') == 'active' &&
            (
              get(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)).data.get('role', '') == 'owner' ||
              get(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)).data.get('role', '') == 'admin' ||
              get(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)).data.get('organizationRole', '') == 'owner' ||
              get(/databases/$(database)/documents/organizations/$(orgId)/members/$(request.auth.uid)).data.get('organizationRole', '') == 'admin'
            )
          )
        );
        allow create, update, delete: if false;
      }'''
          out, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one join_requests block, got {count}')
          p.write_text(out)
          PY
          git diff --check
          git diff -- firestore.rules
      - name: Commit rules patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git diff --cached --check
          git commit -m "fix(security): allow exact globals to read join requests"
          git push origin HEAD:codex/implementar-comandos-canonicos-de-join-request
