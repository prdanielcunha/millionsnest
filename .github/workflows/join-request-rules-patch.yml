name: Apply Join Request Rules Patch

on:
  push:
    branches:
      - "codex/implementar-comandos-canonicos-de-join-request"
    paths:
      - ".github/workflows/join-request-rules-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch only join request read rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firestore.rules')
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'match /join_requests/{requestId} {')
          allow = next(i for i in range(start + 1, len(lines)) if 'allow read, list: if isAuthenticated() && (' in lines[i])
          if any('isSystemAdmin() ||' in lines[i] for i in range(allow + 1, min(allow + 4, len(lines)))):
              raise SystemExit('join request global read rule already patched')
          lines[allow + 1:allow + 1] = ['          isSystemAdmin() ||', '          (']
          create_line = next(i for i in range(allow + 3, len(lines)) if 'allow create, update, delete: if false;' in lines[i])
          close = create_line - 1
          if lines[close].strip() != ');':
              raise SystemExit('unexpected join request read-rule closing line')
          lines[close:close] = ['          )']
          p.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git diff -- firestore.rules
      - name: Commit rules patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git diff --cached --check
          git commit -m "fix(security): allow exact globals to read join requests"
          git push origin HEAD:codex/implementar-comandos-canonicos-de-join-request
