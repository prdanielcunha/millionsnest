name: MillionsNest Read-only MusicScale Data Integrity Audit
on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/music-data-integrity-readonly.yml'
      - 'scripts/audit_music_data_integrity_readonly.ts'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: millionsnest-music-integrity-audit
  cancel-in-progress: false
jobs:
  firestore-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Authenticate to the existing shared MillionsNest Firebase project
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Report only aggregate membership and fixed-band counts
        env:
          GOOGLE_CLOUD_PROJECT: millionsnest
          GCLOUD_PROJECT: millionsnest
          FIREBASE_PROJECT_ID: millionsnest
          MN_INTEGRITY_AUDIT_READ_ONLY: "true"
        run: npx tsx scripts/audit_music_data_integrity_readonly.ts
