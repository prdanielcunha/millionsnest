name: Source Recovery Published Image OFF Proof
on:
  pull_request:
    paths: ['.github/workflows/source-recovery-image-proof.yml', 'scripts/*source-recovery-image*.mjs', 'ops/source-recovery-image-proof.json']
  push:
    branches: [production]
    paths: ['.github/workflows/source-recovery-image-proof.yml', 'scripts/*source-recovery-image*.mjs', 'ops/source-recovery-image-proof.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-recovery-image-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/test-musicscale-serving-release.mjs && node scripts/test-source-recovery-image-proof.mjs
  prove:
    if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [musicscale, nestfinance, nestjourney]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Configure ephemeral runner image reader
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Verify live OFF flag and run exact published worker without network or credentials
        run: node scripts/prove-source-recovery-image.mjs '${{ matrix.source }}'
