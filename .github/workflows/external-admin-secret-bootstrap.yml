name: External Admin Secret Bootstrap

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/external-admin-secret-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Ensure external admin secret containers
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project millionsnest
          for SECRET in mn-vercel-admin-token mn-cloudflare-dns-token; do
            if gcloud secrets describe "$SECRET" --project=millionsnest >/dev/null 2>&1; then
              echo "$SECRET already exists"
            else
              gcloud secrets create "$SECRET"                 --project=millionsnest                 --replication-policy=automatic
              echo "$SECRET created"
            fi
          done

          echo "EXTERNAL_ADMIN_SECRET_CONTAINERS_OK"
