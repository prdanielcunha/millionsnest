name: Activate NestLume Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/nestlume-domain-activate.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestlume-official-domain
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: millionsnest
  FIREBASE_SITE: nestlume-555464791734
  OFFICIAL_DOMAIN: nestlume.millionsnest.com

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Ensure Firebase custom domain
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains"
          STATUS="$(curl --silent --output /tmp/nestlume-domain.json --write-out '%{http_code}'             -H "Authorization: Bearer $ACCESS_TOKEN"             "$BASE/$OFFICIAL_DOMAIN")"

          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci","product":"nestlume"}}'               "$BASE?customDomainId=$OFFICIAL_DOMAIN" >/tmp/nestlume-domain-create.json
            echo "CUSTOM_DOMAIN_CREATED=$OFFICIAL_DOMAIN"
            sleep 12
          elif [ "$STATUS" = "200" ]; then
            echo "CUSTOM_DOMAIN_EXISTS=$OFFICIAL_DOMAIN"
          else
            cat /tmp/nestlume-domain.json
            exit 1
          fi

      - name: Read only Firebase-required NestLume DNS records
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains/$OFFICIAL_DOMAIN"
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$URL" >/tmp/nestlume-domain.json

          python3 - "$OFFICIAL_DOMAIN" "$FIREBASE_SITE" <<'PY'
          import json, sys
          from pathlib import Path

          domain, site = sys.argv[1], sys.argv[2]
          data = json.loads(Path('/tmp/nestlume-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])

          seen, lines = set(), []
          for group in desired:
              for record in list(group.get('records') or [group]):
                  name = str(record.get('domainName') or group.get('domainName') or '').rstrip('.')
                  typ = str(record.get('type') or '').upper()
                  value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
                  action = str(record.get('requiredAction') or 'ADD').upper()
                  key = (name, typ, value, action)
                  if not name or typ not in {'A','AAAA','CNAME','TXT'} or not value or key in seen:
                      continue
                  if not (name == domain or name.endswith('.' + domain)):
                      raise SystemExit(f'Refusing out-of-scope Firebase DNS name: {name}')
                  if action not in {'ADD','NONE'}:
                      raise SystemExit(f'Unexpected destructive DNS action requested: {action} {name} {typ}')
                  seen.add(key)
                  if action == 'ADD':
                      lines.append('\t'.join((name, typ, value)))

          if not lines and data.get('hostState') == 'HOST_UNHOSTED':
              lines.append('\t'.join((domain, 'CNAME', f'{site}.web.app')))

          Path('/tmp/nestlume-dns.tsv').write_text('\n'.join(lines) + ('\n' if lines else ''))
          print(json.dumps({
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(lines),
              'issues': data.get('issues', [])
          }, sort_keys=True))
          PY

      - name: Apply only NestLume DNS records in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/nestlume-dns.tsv ]; then
            echo "Firebase requested no DNS changes."
            exit 0
          fi

          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$FIREBASE_PROJECT")"
          echo "::add-mask::$CF_TOKEN"

          ZONES="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CF_TOKEN"             'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue

            case "$NAME" in
              "$OFFICIAL_DOMAIN"|*."$OFFICIAL_DOMAIN") ;;
              *) echo "Refusing out-of-scope DNS mutation: $NAME"; exit 1 ;;
            esac

            EXISTING="$(curl --fail --silent --show-error -G               -H "Authorization: Bearer $CF_TOKEN"               --data-urlencode "name=$NAME"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")"

            MATCH_ID="$(jq -r --arg name "$NAME" --arg type "$TYPE" --arg value "$VALUE"               '.result[] | select(.name == $name and .type == $type and (.content | rtrimstr(".")) == $value and .proxied != true) | .id'               <<<"$EXISTING" | head -n1)"

            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            if [ "$TYPE" = "CNAME" ]; then
              CONFLICTS="$(jq -r --arg name "$NAME"                 '.result[] | select(.name == $name and (.type == "A" or .type == "AAAA" or .type == "CNAME")) | [.id,.type,.content] | @tsv'                 <<<"$EXISTING")"
              while IFS=$'\t' read -r ID OLD_TYPE OLD_CONTENT; do
                test -n "$ID" || continue
                if [ "$OLD_TYPE" = "CNAME" ]; then
                  curl --fail --silent --show-error -X DELETE                     -H "Authorization: Bearer $CF_TOKEN"                     "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" >/dev/null
                  echo "DNS_REPLACED_OLD_CNAME name=$NAME"
                else
                  echo "Refusing to replace unexpected $OLD_TYPE record at $NAME ($OLD_CONTENT)"
                  exit 1
                fi
              done <<<"$CONFLICTS"
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE"               '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"

            if [ "$TYPE" = "TXT" ]; then
              curl --fail --silent --show-error -X POST                 -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"                 --data "$PAYLOAD"                 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            else
              SAME_TYPE_ID="$(jq -r --arg name "$NAME" --arg type "$TYPE"                 '.result[] | select(.name == $name and .type == $type) | .id' <<<"$EXISTING" | head -n1)"
              if [ -n "$SAME_TYPE_ID" ]; then
                curl --fail --silent --show-error -X PUT                   -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"                   --data "$PAYLOAD"                   "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$SAME_TYPE_ID" >/dev/null
              else
                curl --fail --silent --show-error -X POST                   -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json"                   --data "$PAYLOAD"                   "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
              fi
            fi

            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/nestlume-dns.tsv

      - name: Wait for Firebase ownership, hosting and certificate
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains/$OFFICIAL_DOMAIN"
          READY=false

          for i in $(seq 1 45); do
            curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$URL" >/tmp/nestlume-domain-status.json
            STATE="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/nestlume-domain-status.json'))
          print('|'.join([
              str(x.get('ownershipState') or ''),
              str(x.get('hostState') or ''),
              str((x.get('cert') or {}).get('state') or ''),
              str(bool(x.get('reconciling',False))).lower()
          ]))
          PY
            )"
            echo "DOMAIN_STATE attempt=$i state=$STATE"
            if [ "$STATE" = "OWNERSHIP_ACTIVE|HOST_ACTIVE|CERT_ACTIVE|false" ]; then
              READY=true
              break
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "Official domain did not become fully ready within the bounded verification window."
            cat /tmp/nestlume-domain-status.json | jq '{ownershipState,hostState,reconciling,certState:(.cert.state // null),issues,requiredDnsUpdates}'
            exit 1
          fi

      - name: Verify official HTTPS and canonical app routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/ler/jhn/1?v=1" "/explorar" "/colar" "/caderno"; do
            curl --fail --silent --show-error --location               --retry 12 --retry-delay 3 --retry-all-errors               "https://$OFFICIAL_DOMAIN$path" >/tmp/nestlume-official.html
            grep -Fq 'NestLume' /tmp/nestlume-official.html
          done

          echo "NESTLUME_OFFICIAL_DOMAIN_READY=https://$OFFICIAL_DOMAIN"
