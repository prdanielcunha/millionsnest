name: Connect Scoped Execution Secret Bootstrap
on:
  push:
    branches: [production]
    paths: [.github/workflows/connect-scoped-secret-bootstrap.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: connect-scoped-secret-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Authenticate through existing sanctioned Infra Admin WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com
      - name: Create only the new Connect bundle; never read or rotate existing values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PROJECT_ID=millionsnest
          SECRET_ID=connect-execution-v1
          test "$SECRET_ID" = connect-execution-v1
          if gcloud secrets describe "$SECRET_ID" --project "$PROJECT_ID" --format='value(name)' >/dev/null 2>&1; then
            echo CONNECT_EXECUTION_SECRET_METADATA_ALREADY_EXISTS
          else
            gcloud secrets create "$SECRET_ID" --project "$PROJECT_ID" --replication-policy automatic --quiet
          fi
          ENABLED="$(gcloud secrets versions list "$SECRET_ID" --project "$PROJECT_ID" --filter='state=ENABLED' --format='value(name)' --limit=1)"
          if [ -z "$ENABLED" ]; then
            node --input-type=module <<'JS'
          import { generateKeyPairSync, randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const { privateKey }=generateKeyPairSync('ec',{namedCurve:'prime256v1'});
          const key=privateKey.export({format:'jwk'});
          const publicKey=Buffer.concat([Buffer.from([4]),Buffer.from(key.x,'base64url'),Buffer.from(key.y,'base64url')]).toString('base64url');
          const bundle={CONNECT_WEB_PUSH_PUBLIC_KEY:publicKey,CONNECT_WEB_PUSH_PRIVATE_KEY:key.d,CONNECT_WEB_PUSH_SUBJECT:'https://connect.millionsnest.com',CONNECT_AUTOMATION_WORKER_SECRET:randomBytes(48).toString('base64url'),CONNECT_SUPPORT_ORIGIN_SECRET:randomBytes(48).toString('base64url')};
          writeFileSync('/tmp/connect-execution-secret.json',JSON.stringify(bundle),{mode:0o600,flag:'wx'});
          JS
            trap 'rm -f /tmp/connect-execution-secret.json' EXIT
            gcloud secrets versions add "$SECRET_ID" --project "$PROJECT_ID" --data-file=/tmp/connect-execution-secret.json --quiet >/dev/null
            rm /tmp/connect-execution-secret.json
            echo CONNECT_EXECUTION_SECRET_INITIAL_VERSION_CREATED
          else
            echo CONNECT_EXECUTION_SECRET_EXISTING_VERSION_PRESERVED
          fi
          gcloud secrets add-iam-policy-binding "$SECRET_ID" --project "$PROJECT_ID" \
            --member='serviceAccount:mn-connect-runtime@millionsnest.iam.gserviceaccount.com' \
            --role=roles/secretmanager.secretAccessor --condition=None --quiet >/dev/null
          gcloud secrets get-iam-policy "$SECRET_ID" --project "$PROJECT_ID" --format=json > /tmp/connect-secret-iam.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/connect-secret-iam.json'))
          assert any(b['role']=='roles/secretmanager.secretAccessor' and 'serviceAccount:mn-connect-runtime@millionsnest.iam.gserviceaccount.com' in b.get('members',[]) for b in d.get('bindings',[]))
          print('CONNECT_EXECUTION_SECRET_RUNTIME_ACCESS_CONFIRMED')
          PY
          rm /tmp/connect-secret-iam.json
          echo CONNECT_EXECUTION_SECRET_FLAGS_AND_META_UNCHANGED
