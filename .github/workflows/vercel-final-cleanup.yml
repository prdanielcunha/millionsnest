name: Vercel Final Cleanup (retired)

# MillionsNest production is hosted on Firebase Hosting + Cloud Run.
# This workflow remains only as an explicit historical/manual marker so Vercel
# cleanup can never participate in a normal release again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retired migration task
        run: |
          echo "VERCEL_FINAL_CLEANUP_RETIRED"
          echo "MillionsNest production uses Firebase Hosting + Cloud Run."
          echo "No Vercel action is performed by this workflow."
