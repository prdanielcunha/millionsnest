name: MusicScale Live AI Gateway QA

on:
  pull_request:
    branches: [main]
    paths:
      - "server.ts"
      - "src/server/services/MusicScaleLiveAiGatewayService.ts"
      - "scripts/test_musicscale_live_ai_gateway.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/musicscale-live-ai-gateway-qa.yml"
  push:
    branches: [main]
    paths:
      - "server.ts"
      - "src/server/services/MusicScaleLiveAiGatewayService.ts"
      - "scripts/test_musicscale_live_ai_gateway.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/musicscale-live-ai-gateway-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicscale-live-ai-gateway-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Certify MusicScale Live AI gateway
        run: npm run test:musicscale-live-ai
