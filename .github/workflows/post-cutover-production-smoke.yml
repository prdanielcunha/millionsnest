name: Post Cutover Production Smoke
# Final verification trigger

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/post-cutover-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify DNS cutover
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          expect_a () {
            DOMAIN="$1"
            EXPECTED="$2"
            echo "===== DNS A: $DOMAIN ====="
            FOUND="$(dig +short A "$DOMAIN" | tail -n1 | tr -d '[:space:]')"
            echo "FOUND=$FOUND"
            test "$FOUND" = "$EXPECTED"
          }

          expect_cname () {
            DOMAIN="$1"
            EXPECTED="$2"
            echo "===== DNS CNAME: $DOMAIN ====="
            FOUND="$(dig +short CNAME "$DOMAIN" | tail -n1 | sed 's/\.$//')"
            echo "FOUND=$FOUND"
            test "$FOUND" = "$EXPECTED"
          }

          expect_a "millionsnest.com" "199.36.158.100"
          expect_cname "www.millionsnest.com" "mn-hub-555464791734.web.app"
          expect_cname "musicscale.millionsnest.com" "mn-musicscale-555464791734.web.app"
          expect_cname "nestfinance.millionsnest.com" "mn-nestfinance-555464791734.web.app"
          expect_cname "connect.millionsnest.com" "mn-connect-555464791734.web.app"
          expect_cname "nestjourney.millionsnest.com" "mn-nestjourney-555464791734.web.app"

          echo "DNS_CUTOVER_OK"

      - name: Smoke Hub root and www
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for URL in "https://millionsnest.com/" "https://www.millionsnest.com/"; do
            echo "===== $URL ====="
            curl --fail --silent --show-error --location               --retry 12 --retry-delay 3 --retry-all-errors               "$URL" -o /tmp/hub.html
            grep -Eiq '<!doctype html|<html' /tmp/hub.html
          done
          echo "HUB_PRODUCTION_HTTPS_OK"

      - name: Diagnose Firebase Auth reserved endpoints
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          check_host () {
            BASE="$1"
            SAFE="$(echo "$BASE" | tr -cd '[:alnum:]')"
            echo "===== FIREBASE AUTH DIAGNOSTICS: $BASE ====="

            INIT_META="$(curl --silent --show-error --max-time 20 \
              -o "/tmp/${SAFE}-init.json" \
              -w '%{http_code}|%{content_type}|%{remote_ip}|%{time_total}' \
              "$BASE/__/firebase/init.json" || true)"
            echo "INIT=$INIT_META"
            head -c 500 "/tmp/${SAFE}-init.json" 2>/dev/null || true
            echo

            HANDLER_META="$(curl --silent --show-error --max-time 20 \
              -o "/tmp/${SAFE}-handler.html" \
              -w '%{http_code}|%{content_type}|%{remote_ip}|%{time_total}|%{redirect_url}' \
              "$BASE/__/auth/handler" || true)"
            echo "HANDLER=$HANDLER_META"
            head -c 300 "/tmp/${SAFE}-handler.html" 2>/dev/null || true
            echo
          }

          check_host "https://millionsnest.com"
          check_host "https://www.millionsnest.com"
          check_host "https://mn-hub-555464791734.web.app"

          node <<'NODE'
          const fs = require('fs');
          for (const name of [
            'httpsmillionsnestcom-init.json',
            'httpswwwmillionsnestcom-init.json',
            'httpsmnhub555464791734webapp-init.json'
          ]) {
            const p = '/tmp/' + name;
            if (!fs.existsSync(p)) continue;
            try {
              const x = JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log('FIREBASE_INIT', name, {
                projectId: x.projectId,
                authDomain: x.authDomain,
                appId: x.appId
              });
            } catch (error) {
              console.log('FIREBASE_INIT_PARSE_FAILED', name, String(error));
            }
          }
          NODE

      - name: Diagnose public Firebase Auth project configuration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          inspect_key () {
            LABEL="$1"
            KEY="$2"
            echo "===== IDENTITY TOOLKIT PUBLIC CONFIG: $LABEL ====="
            META="$(curl --silent --show-error --max-time 20 \
              -o "/tmp/idtk-${LABEL}.json" \
              -w '%{http_code}|%{content_type}|%{time_total}' \
              "https://identitytoolkit.googleapis.com/v1/projects?key=${KEY}" || true)"
            echo "META=$META"
            node - "/tmp/idtk-${LABEL}.json" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          try {
            const x = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(JSON.stringify({
              projectId: x.projectId,
              authorizedDomains: x.authorizedDomains || [],
              error: x.error ? {
                code: x.error.code,
                status: x.error.status,
                message: x.error.message
              } : null
            }, null, 2));
          } catch (error) {
            console.log('IDENTITY_TOOLKIT_PARSE_FAILED', String(error));
          }
          NODE
          }

          BUILD_KEY="AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs"
          HOSTED_KEY="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/httpswwwmillionsnestcom-init.json','utf8')); process.stdout.write(String(x.apiKey||''));")"

          inspect_key "build" "$BUILD_KEY"
          inspect_key "hosted" "$HOSTED_KEY"

      - name: Smoke Hub API and Stripe read path
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             --retry 12 --retry-delay 3 --retry-all-errors             "https://www.millionsnest.com/api/v1/billing/products" -o /tmp/products.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/products.json','utf8'));if(!x||!Array.isArray(x.plans))process.exit(1);console.log('HUB_BILLING_READ_OK',x.plans.length);"

      - name: Smoke MusicScale
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://musicscale.millionsnest.com"
          curl --fail --silent --show-error --location             --retry 12 --retry-delay 3 --retry-all-errors             "$BASE/" -o /tmp/ms.html
          grep -Eiq '<!doctype html|<html' /tmp/ms.html

          STATUS="$(curl --silent --show-error --location             -o /tmp/ms-api.json -w '%{http_code}'             "$BASE/api/v1/ecosystem/access-context?organizationId=production-smoke")"
          test "$STATUS" = "401"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/ms-api.json','utf8'));if(!String(x.error||'').toLowerCase().includes('unauthorized'))process.exit(1);"
          echo "MUSICSCALE_PRODUCTION_OK"

      - name: Smoke NestFinance
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nestfinance.millionsnest.com"
          curl --fail --silent --show-error --location             --retry 12 --retry-delay 3 --retry-all-errors             "$BASE/" -o /tmp/nf.html
          grep -Eiq '<!doctype html|<html' /tmp/nf.html

          curl --fail --silent --show-error --location             "$BASE/api/system/release" -o /tmp/nf-release.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/nf-release.json','utf8'));if(x.app!=='nestfinance')process.exit(1);console.log('NESTFINANCE_PRODUCTION_OK');"

      - name: Smoke Connect and NestJourney
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for URL in             "https://connect.millionsnest.com/"             "https://nestjourney.millionsnest.com/"
          do
            echo "===== $URL ====="
            curl --fail --silent --show-error --location               --retry 12 --retry-delay 3 --retry-all-errors               "$URL" -o /tmp/static.html
            grep -Eiq '<!doctype html|<html' /tmp/static.html
          done
          echo "CONNECT_NESTJOURNEY_PRODUCTION_OK"
