name: Activate NestAffiliate Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/nestaffiliate-domain-activate.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestaffiliate-official-domain
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: millionsnest
  FIREBASE_SITE: mn-nestaffiliate-555464791734
  LIVE_DOMAIN: nestaffiliate.millionsnest.com

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Ensure Firebase Authentication domains
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CONFIG="$(curl --fail --silent --show-error             -H "Authorization: Bearer $ACCESS_TOKEN"             "https://identitytoolkit.googleapis.com/admin/v2/projects/$FIREBASE_PROJECT/config")"
          FALLBACK="$FIREBASE_SITE.web.app"
          DOMAINS="$(jq -c --arg live "$LIVE_DOMAIN" --arg fallback "$FALLBACK"             '.authorizedDomains + [$live, $fallback] | unique' <<<"$CONFIG")"
          jq -n --argjson domains "$DOMAINS" '{authorizedDomains:$domains}' >/tmp/na-auth.json
          curl --fail --silent --show-error -X PATCH             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/na-auth.json             "https://identitytoolkit.googleapis.com/admin/v2/projects/$FIREBASE_PROJECT/config?updateMask=authorizedDomains"             >/dev/null
          echo "NESTAFFILIATE_AUTH_DOMAINS_READY=true"

      - name: Verify NestAffiliate Google Auth bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          APPS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/webApps?pageSize=100")"
          APP_NAME="$(jq -r '.apps[] | select(.displayName == "MillionsNest" or .displayName == "millionsnest") | .name' <<<"$APPS" | head -n1)"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="$(jq -r '.apps[0].name // empty' <<<"$APPS")"
          fi
          test -n "$APP_NAME"

          CONFIG="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/$APP_NAME/config")"
          API_KEY="$(jq -r '.apiKey // empty' <<<"$CONFIG")"
          AUTH_DOMAIN="$(jq -r '.authDomain // empty' <<<"$CONFIG")"
          test -n "$API_KEY"
          test -n "$AUTH_DOMAIN"
          echo "::add-mask::$API_KEY"
          echo "FIREBASE_AUTH_DOMAIN=$AUTH_DOMAIN"

          BODY="$(jq -nc --arg uri "https://$LIVE_DOMAIN/" '{providerId:"google.com",continueUri:$uri,customParameter:{prompt:"select_account"}}')"
          STATUS="$(curl --silent --show-error \
            --output /tmp/na-create-auth-uri.json \
            --write-out '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Origin: https://$LIVE_DOMAIN" \
            -H "Referer: https://$LIVE_DOMAIN/" \
            --data "$BODY" \
            "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$API_KEY")"
          echo "CREATE_AUTH_URI_STATUS=$STATUS"
          jq '{authUri:(.authUri // null),providerId:(.providerId // null),error:(.error.message // null)}' /tmp/na-create-auth-uri.json
          test "$STATUS" = "200"
          jq -e '.authUri | strings | length > 0' /tmp/na-create-auth-uri.json >/dev/null
          echo "NESTAFFILIATE_GOOGLE_AUTH_BOOTSTRAP_OK=true"

      - name: Ensure Firebase custom domain resource
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains"
          STATUS="$(curl --silent --show-error --output /tmp/na-domain.json --write-out '%{http_code}'             -H "Authorization: Bearer $ACCESS_TOKEN" "$BASE/$LIVE_DOMAIN")"
          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST               -H "Authorization: Bearer $ACCESS_TOKEN"               -H "Content-Type: application/json"               --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci","product":"nestaffiliate"}}'               "$BASE?customDomainId=$LIVE_DOMAIN" >/tmp/na-domain-create.json
            echo "CUSTOM_DOMAIN_CREATED=$LIVE_DOMAIN"
            sleep 12
          elif [ "$STATUS" = "200" ]; then
            echo "CUSTOM_DOMAIN_EXISTS=$LIVE_DOMAIN"
          else
            cat /tmp/na-domain.json
            exit 1
          fi

          curl --fail --silent --show-error             -H "Authorization: Bearer $ACCESS_TOKEN"             "$BASE/$LIVE_DOMAIN" >/tmp/na-domain.json

      - name: Read Firebase required DNS
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$LIVE_DOMAIN" "$FIREBASE_SITE" <<'PY'
          import json, sys
          from pathlib import Path

          domain, site = sys.argv[1], sys.argv[2]
          data = json.loads(Path('/tmp/na-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])

          rows = set()
          for record in desired:
              name = str(record.get('domainName') or '').rstrip('.')
              kind = str(record.get('type') or '').upper()
              value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
              if not name or not value or kind not in {'A','AAAA','CNAME','TXT'}:
                  continue
              if name != domain and not name.endswith('.' + domain):
                  raise SystemExit(f'Firebase returned out-of-scope DNS name: {name}')
              rows.add((name, kind, value))

          if not any(name == domain and kind in {'A','AAAA','CNAME'} for name, kind, _ in rows):
              rows.add((domain, 'CNAME', f'{site}.web.app'))

          Path('/tmp/na-dns.tsv').write_text(''.join('\t'.join(row) + '\n' for row in sorted(rows)))
          print(json.dumps({
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(rows)
          }, sort_keys=True))
          PY

      - name: Apply only NestAffiliate DNS in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$FIREBASE_PROJECT")"
          echo "::add-mask::$CF_TOKEN"
          ZONES="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CF_TOKEN"             'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue
            case "$NAME" in
              "$LIVE_DOMAIN"|*."$LIVE_DOMAIN") ;;
              *) echo "REFUSING_OUT_OF_SCOPE_DNS=$NAME"; exit 1 ;;
            esac

            EXISTING_ALL="$(curl --fail --silent --show-error -G               -H "Authorization: Bearer $CF_TOKEN"               --data-urlencode "name=$NAME"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100")"

            MATCH_ID="$(jq -r --arg type "$TYPE" --arg value "$VALUE"               '.result[] | select(.type == $type and (.content | rtrimstr(".")) == $value and .proxied != true) | .id'               <<<"$EXISTING_ALL" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            if [ "$TYPE" = "CNAME" ]; then
              CONFLICT="$(jq -r '.result[] | select(.type == "A" or .type == "AAAA") | [.id,.type,.content] | @tsv' <<<"$EXISTING_ALL")"
              if [ -n "$CONFLICT" ]; then
                echo "REFUSING_TO_REPLACE_EXISTING_ADDRESS_RECORD name=$NAME"
                echo "$CONFLICT"
                exit 1
              fi
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE"               '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"
            SAME_TYPE_ID="$(jq -r --arg type "$TYPE" '.result[] | select(.type == $type) | .id' <<<"$EXISTING_ALL" | head -n1)"
            if [ -n "$SAME_TYPE_ID" ] && [ "$TYPE" != "TXT" ]; then
              curl --fail --silent --show-error -X PUT                 -H "Authorization: Bearer $CF_TOKEN"                 -H "Content-Type: application/json"                 --data "$PAYLOAD"                 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$SAME_TYPE_ID" >/dev/null
            else
              curl --fail --silent --show-error -X POST                 -H "Authorization: Bearer $CF_TOKEN"                 -H "Content-Type: application/json"                 --data "$PAYLOAD"                 "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/na-dns.tsv

      - name: Verify delegation, Firebase state and HTTPS
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$FIREBASE_PROJECT")"
          ZONES="$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN"             'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          PUBLIC_NS="$(dig +short NS millionsnest.com | sed 's/\.$//' | sort)"
          CLOUDFLARE_NS="$(jq -r '.result[0].name_servers[]?' <<<"$ZONES" | sed 's/\.$//' | sort)"
          test "$PUBLIC_NS" = "$CLOUDFLARE_NS"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT/sites/$FIREBASE_SITE/customDomains/$LIVE_DOMAIN"

          live=false
          for attempt in $(seq 1 75); do
            curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$URL" >/tmp/na-domain-final.json
            HOST_STATE="$(jq -r '.hostState // empty' /tmp/na-domain-final.json)"
            CERT_STATE="$(jq -r '.cert.state // empty' /tmp/na-domain-final.json)"
            echo "DOMAIN_STATE attempt=$attempt host=$HOST_STATE cert=$CERT_STATE"
            if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 20               "https://$LIVE_DOMAIN/" -o /tmp/na-live.html 2>/dev/null &&
              grep -Eiq '<!doctype html|<html' /tmp/na-live.html; then
              live=true
              break
            fi
            sleep 12
          done

          test "$live" = "true"
          jq '{ownershipState,hostState,reconciling,certState:(.cert.state // null),issues}' /tmp/na-domain-final.json
          echo "NESTAFFILIATE_OFFICIAL_DOMAIN_OK=https://$LIVE_DOMAIN"
