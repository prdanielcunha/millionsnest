name: NestJourney Contact Authorization Contract

on:
  pull_request:
    paths:
      - 'src/server/services/NestJourneyFollowupContextService.ts'
      - 'scripts/test_connect_nestjourney_followup.ts'
      - '.github/workflows/nestjourney-contact-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx scripts/test_connect_nestjourney_followup.ts
