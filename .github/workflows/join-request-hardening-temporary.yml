name: Temporary Join Request Hardening

on:
  push:
    branches:
      - codex/implementar-comandos-canonicos-de-join-request

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'ci: harden join request PR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact starting PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e23559bf264361d30baf1d73122eb95bddc505d2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/join-request-hardening-temporary.yml"

      - name: Apply reviewed security hardening
        shell: bash
        run: |
          set -euo pipefail
          cat > src/server/services/JoinRequestCommandService.ts <<'EOF'
          import { Request, Response } from 'express';
          import { getAuth } from 'firebase-admin/auth';
          import { FieldValue, Firestore, getFirestore } from 'firebase-admin/firestore';
          import { isCanonicalGlobalRole } from '../../lib/permissionService.js';
          import { isExistingMembershipRole, normalizeInvitationEmail } from './InvitationAcceptancePlanner.js';
          import { normalizeInvitationTemporalMs, resolveCanonicalInvitationCapacity } from './InvitationAcceptanceServerPolicy.js';

          type AuthenticatedUserRecord = {
            email?: string | null;
            displayName?: string | null;
            photoURL?: string | null;
          };

          type Dependencies = {
            verifyIdToken?: (token: string) => Promise<{ uid: string }>;
            getUser?: (uid: string) => Promise<AuthenticatedUserRecord>;
            getFirestore?: () => Firestore;
            now?: () => number;
          };

          type Command = 'approve' | 'reject';
          type MembershipState = 'absent' | 'active' | 'inactive' | 'inconsistent';

          const INACTIVE_MEMBERSHIP_STATUSES = ['suspended', 'inactive', 'removed', 'revoked', 'deleted'];

          function statusFor(reasonCode: string): number {
            if (reasonCode === 'ORGANIZATION_NOT_FOUND' || reasonCode === 'JOIN_REQUEST_NOT_FOUND') return 404;
            if (reasonCode === 'PERMISSION_DENIED' || reasonCode === 'SELF_RESOLUTION_DENIED') return 403;
            if (reasonCode === 'MEMBER_LIMIT_UNAVAILABLE') return 503;
            if (
              reasonCode === 'ORGANIZATION_INACTIVE' ||
              reasonCode === 'MEMBERSHIP_INACTIVE' ||
              reasonCode === 'MEMBER_LIMIT_INVALID' ||
              reasonCode === 'MEMBER_LIMIT_REACHED' ||
              reasonCode.includes('STATE_INCONSISTENT') ||
              reasonCode.includes('CANNOT_')
            ) return 409;
            return 400;
          }

          function isSafeDocumentId(value: unknown): value is string {
            return typeof value === 'string' && value.length > 0 && value.length <= 256 &&
              value !== '.' && value !== '..' && !value.includes('/') && !/[\u0000-\u001F\u007F]/.test(value);
          }

          function normalizeProfileText(value: unknown, maxLength: number): string | undefined {
            if (typeof value !== 'string') return undefined;
            const normalized = value.trim();
            if (!normalized) return undefined;
            return normalized.slice(0, maxLength);
          }

          function classifyMembership(data: FirebaseFirestore.DocumentData | undefined): MembershipState {
            if (!data) return 'absent';
            if (INACTIVE_MEMBERSHIP_STATUSES.includes(data.status)) return 'inactive';
            if (data.status !== undefined && data.status !== 'active') return 'inconsistent';
            const role = data.organizationRole ?? data.role;
            return isExistingMembershipRole(role) ? 'active' : 'inconsistent';
          }

          function canonicalMemberRoleIsMember(data: FirebaseFirestore.DocumentData | undefined): boolean {
            if (!data) return false;
            const role = data.role;
            const organizationRole = data.organizationRole;
            if (role !== undefined && role !== 'member') return false;
            if (organizationRole !== undefined && organizationRole !== 'member') return false;
            return role === 'member' || organizationRole === 'member';
          }

          function existingGeneration(data: FirebaseFirestore.DocumentData | undefined): number {
            const value = data?.generation;
            return typeof value === 'number' && Number.isInteger(value) && value > 0 ? value : 1;
          }

          async function authenticate(req: Request, dependencies: Dependencies): Promise<string | null> {
            const header = req.headers.authorization;
            if (!header?.startsWith('Bearer ') || header.length <= 7) return null;
            try {
              const verify = dependencies.verifyIdToken ?? ((token: string) => getAuth().verifyIdToken(token));
              const uid = (await verify(header.slice(7))).uid;
              return isSafeDocumentId(uid) ? uid : null;
            } catch {
              return null;
            }
          }

          function hasOrganizationAuthority(
            uid: string,
            organization: FirebaseFirestore.DocumentData,
            membership: FirebaseFirestore.DocumentData | undefined
          ): boolean {
            if (organization.ownerUid === uid || organization.ownerId === uid || organization.owner_user_id === uid || organization.ownerUserId === uid) return true;
            if (classifyMembership(membership) !== 'active') return false;
            const role = membership?.organizationRole ?? membership?.role;
            return role === 'owner' || role === 'admin';
          }

          function countReservedPendingInvites(
            docs: FirebaseFirestore.QueryDocumentSnapshot[],
            nowMs: number
          ): number {
            let pending = 0;
            for (const doc of docs) {
              const data = doc.data();
              if (data.status !== 'pending') continue;
              const expiresAtMs = normalizeInvitationTemporalMs(data.expiresAt);
              const revokedAtMs = normalizeInvitationTemporalMs(data.revokedAt);
              const validUseState = Number.isInteger(data.maxUses) && data.maxUses > 0 && Number.isInteger(data.useCount) && data.useCount >= 0 && data.useCount < data.maxUses;
              if (revokedAtMs === undefined && expiresAtMs !== undefined && expiresAtMs > nowMs && validUseState && typeof data.emailNormalized === 'string') {
                pending += 1;
              }
            }
            return pending;
          }

          export async function createJoinRequest(req: Request, res: Response, dependencies: Dependencies = {}) {
            const uid = await authenticate(req, dependencies);
            if (!uid) return res.status(401).json({ success: false, reasonCode: 'UNAUTHENTICATED' });
            const organizationId = req.params.organizationId;
            if (!isSafeDocumentId(organizationId)) return res.status(400).json({ success: false, reasonCode: 'INVALID_ORGANIZATION_ID' });

            let userRecord: AuthenticatedUserRecord;
            try {
              const resolveUser = dependencies.getUser ?? ((userId: string) => getAuth().getUser(userId));
              userRecord = await resolveUser(uid);
            } catch {
              return res.status(500).json({ success: false, reasonCode: 'IDENTITY_LOOKUP_FAILED' });
            }
            const email = normalizeInvitationEmail(userRecord.email);
            if (!email) return res.status(409).json({ success: false, reasonCode: 'IDENTITY_EMAIL_UNAVAILABLE' });
            const displayName = normalizeProfileText(userRecord.displayName, 160) ?? email.split('@')[0];
            const photoURL = normalizeProfileText(userRecord.photoURL, 2048);

            try {
              const db = (dependencies.getFirestore ?? getFirestore)();
              const result = await db.runTransaction(async transaction => {
                const orgRef = db.doc(`organizations/${organizationId}`);
                const memberRef = db.doc(`organizations/${organizationId}/members/${uid}`);
                const requestRef = db.doc(`organizations/${organizationId}/join_requests/${uid}`);
                const [orgSnap, memberSnap, requestSnap] = await Promise.all([
                  transaction.get(orgRef), transaction.get(memberRef), transaction.get(requestRef)
                ]);
                if (!orgSnap.exists) return { statusCode: 404, payload: { success: false, reasonCode: 'ORGANIZATION_NOT_FOUND' } };
                if (orgSnap.data()?.status !== 'active') return { statusCode: 409, payload: { success: false, reasonCode: 'ORGANIZATION_INACTIVE' } };

                const membershipState = classifyMembership(memberSnap.data());
                if (membershipState === 'active') return { statusCode: 200, payload: { success: true, reasonCode: 'ALREADY_MEMBER' } };
                if (membershipState === 'inactive') return { statusCode: 409, payload: { success: false, reasonCode: 'MEMBERSHIP_INACTIVE' } };
                if (membershipState === 'inconsistent') return { statusCode: 409, payload: { success: false, reasonCode: 'MEMBERSHIP_STATE_INCONSISTENT' } };

                const previousRequest = requestSnap.data();
                if (requestSnap.exists && previousRequest?.status === 'pending') {
                  return { statusCode: 200, payload: { success: true, reasonCode: 'ALREADY_PENDING', requestId: uid, generation: existingGeneration(previousRequest) } };
                }
                if (requestSnap.exists && previousRequest?.status !== 'approved' && previousRequest?.status !== 'rejected') {
                  return { statusCode: 409, payload: { success: false, reasonCode: 'JOIN_REQUEST_STATE_INCONSISTENT' } };
                }

                const generation = requestSnap.exists ? existingGeneration(previousRequest) + 1 : 1;
                transaction.set(requestRef, {
                  id: uid,
                  requestId: uid,
                  generation,
                  organizationId,
                  requesterUid: uid,
                  requesterEmailNormalized: email,
                  email,
                  displayName,
                  ...(photoURL ? { photoURL } : {}),
                  status: 'pending',
                  requestedAt: FieldValue.serverTimestamp(),
                  createdAt: FieldValue.serverTimestamp(),
                  updatedAt: FieldValue.serverTimestamp()
                });
                transaction.set(db.doc(`organizations/${organizationId}/audit_logs/join_request_${uid}_g${generation}_created`), {
                  action: 'join_request.created', actorUid: uid, requestId: uid, requestGeneration: generation,
                  timestamp: FieldValue.serverTimestamp()
                });
                return { statusCode: 201, payload: { success: true, reasonCode: 'JOIN_REQUEST_CREATED', requestId: uid, generation } };
              });
              return res.status(result.statusCode).json(result.payload);
            } catch {
              return res.status(500).json({ success: false, reasonCode: 'INTERNAL_ERROR' });
            }
          }

          async function resolveJoinRequest(req: Request, res: Response, command: Command, dependencies: Dependencies) {
            const actorUid = await authenticate(req, dependencies);
            if (!actorUid) return res.status(401).json({ success: false, reasonCode: 'UNAUTHENTICATED' });
            const { organizationId, requestId } = req.params;
            if (!isSafeDocumentId(organizationId) || !isSafeDocumentId(requestId)) {
              return res.status(400).json({ success: false, reasonCode: 'INVALID_REQUEST_PATH' });
            }

            try {
              const db = (dependencies.getFirestore ?? getFirestore)();
              const now = dependencies.now ?? Date.now;
              const result = await db.runTransaction(async transaction => {
                const orgRef = db.doc(`organizations/${organizationId}`);
                const actorRef = db.doc(`users/${actorUid}`);
                const actorMemberRef = db.doc(`organizations/${organizationId}/members/${actorUid}`);
                const requestRef = db.doc(`organizations/${organizationId}/join_requests/${requestId}`);
                const [orgSnap, actorSnap, actorMemberSnap, requestSnap] = await Promise.all([
                  transaction.get(orgRef), transaction.get(actorRef), transaction.get(actorMemberRef), transaction.get(requestRef)
                ]);
                if (!orgSnap.exists) return { reasonCode: 'ORGANIZATION_NOT_FOUND' };
                if (orgSnap.data()?.status !== 'active') return { reasonCode: 'ORGANIZATION_INACTIVE' };
                const globalAuthority = isCanonicalGlobalRole(actorSnap.data()?.systemRole);
                if (!globalAuthority && !hasOrganizationAuthority(actorUid, orgSnap.data()!, actorMemberSnap.data())) return { reasonCode: 'PERMISSION_DENIED' };
                if (!requestSnap.exists) return { reasonCode: 'JOIN_REQUEST_NOT_FOUND' };

                const request = requestSnap.data()!;
                if (request.organizationId !== undefined && request.organizationId !== organizationId) return { reasonCode: 'JOIN_REQUEST_STATE_INCONSISTENT' };
                const requesterUid = request.requesterUid === undefined ? requestId : request.requesterUid;
                if (!isSafeDocumentId(requesterUid) || requesterUid !== requestId) return { reasonCode: 'JOIN_REQUEST_STATE_INCONSISTENT' };
                if (requesterUid === actorUid) return { reasonCode: 'SELF_RESOLUTION_DENIED' };
                const generation = existingGeneration(request);

                const memberRef = db.doc(`organizations/${organizationId}/members/${requesterUid}`);
                const requesterUserRef = db.doc(`users/${requesterUid}`);
                const [memberSnap, requesterUserSnap] = await Promise.all([
                  transaction.get(memberRef), transaction.get(requesterUserRef)
                ]);

                if (request.status === 'approved') {
                  if (command === 'reject') return { reasonCode: 'APPROVED_CANNOT_BE_REJECTED' };
                  const member = memberSnap.data();
                  if (classifyMembership(member) !== 'active' || !canonicalMemberRoleIsMember(member)) {
                    return { reasonCode: 'APPROVED_STATE_INCONSISTENT' };
                  }
                  return { success: true, reasonCode: 'ALREADY_APPROVED', generation };
                }
                if (request.status === 'rejected') {
                  if (command === 'approve') return { reasonCode: 'REJECTED_CANNOT_BE_APPROVED' };
                  return { success: true, reasonCode: 'ALREADY_REJECTED', generation };
                }
                if (request.status !== 'pending') return { reasonCode: 'JOIN_REQUEST_STATE_INCONSISTENT' };

                if (command === 'approve') {
                  const membershipState = classifyMembership(memberSnap.data());
                  if (membershipState === 'active') return { reasonCode: 'MEMBERSHIP_STATE_INCONSISTENT' };
                  if (membershipState === 'inactive') return { reasonCode: 'MEMBERSHIP_INACTIVE' };
                  if (membershipState === 'inconsistent') return { reasonCode: 'MEMBERSHIP_STATE_INCONSISTENT' };

                  const subRef = db.doc(`subscriptions/${organizationId}`);
                  const [subSnap, membersQuery, invitesQuery] = await Promise.all([
                    transaction.get(subRef),
                    transaction.get(db.collection(`organizations/${organizationId}/members`)),
                    transaction.get(db.collection(`organizations/${organizationId}/invites`))
                  ]);
                  const subData = subSnap.data() ?? {};
                  const orgData = orgSnap.data() ?? {};
                  const capacityResult = resolveCanonicalInvitationCapacity({
                    organizationId,
                    subscription: {
                      exists: subSnap.exists,
                      organizationId: subData.organizationId,
                      app: subData.app,
                      status: subData.status,
                      plan: subData.plan,
                      limitsUsers: subData.limits?.users
                    },
                    organizationApp: {
                      exists: !!orgData.apps?.musicscale,
                      status: orgData.apps?.musicscale?.status,
                      plan: orgData.apps?.musicscale?.plan,
                      limitsUsers: orgData.apps?.musicscale?.limits?.users
                    },
                    memberStatuses: membersQuery.docs.map(doc => doc.data().status)
                  });
                  if (!capacityResult.success) return { reasonCode: capacityResult.reasonCode };
                  if (capacityResult.capacity.mode === 'limited') {
                    const currentActiveMembers = capacityResult.capacity.currentActiveMembers;
                    const maxMembers = capacityResult.capacity.maxMembers;
                    if (!Number.isInteger(currentActiveMembers) || !Number.isInteger(maxMembers) || currentActiveMembers! < 0 || maxMembers! < 0) {
                      return { reasonCode: 'MEMBER_LIMIT_INVALID' };
                    }
                    const occupiedSlots = currentActiveMembers! + countReservedPendingInvites(invitesQuery.docs, now());
                    if (occupiedSlots > maxMembers!) return { reasonCode: 'MEMBER_LIMIT_INVALID' };
                    if (occupiedSlots === maxMembers!) return { reasonCode: 'MEMBER_LIMIT_REACHED' };
                  } else if (capacityResult.capacity.mode !== 'unlimited') {
                    return { reasonCode: 'MEMBER_LIMIT_INVALID' };
                  }

                  const requesterEmail = normalizeInvitationEmail(request.requesterEmailNormalized ?? request.email);
                  transaction.set(memberRef, {
                    uid: requesterUid,
                    organizationId,
                    ...(requesterEmail ? { emailNormalized: requesterEmail } : {}),
                    role: 'member',
                    organizationRole: 'member',
                    status: 'active',
                    joinedAt: FieldValue.serverTimestamp(),
                    createdAt: FieldValue.serverTimestamp(),
                    updatedAt: FieldValue.serverTimestamp()
                  });
                  transaction.set(db.doc(`organization_members/${requesterUid}_${organizationId}`), {
                    uid: requesterUid,
                    organizationId,
                    ...(requesterEmail ? { emailNormalized: requesterEmail } : {}),
                    role: 'member',
                    organizationRole: 'member',
                    status: 'active',
                    updatedAt: FieldValue.serverTimestamp()
                  }, { merge: true });
                  const user = requesterUserSnap.data() ?? {};
                  transaction.set(requesterUserRef, {
                    uid: requesterUid,
                    organizations: FieldValue.arrayUnion(organizationId),
                    ...(!user.activeOrganizationId ? { activeOrganizationId: organizationId } : {}),
                    ...(!user.organizationId ? { organizationId } : {}),
                    ...(!user.primaryOrganizationId ? { primaryOrganizationId: organizationId } : {}),
                    updatedAt: FieldValue.serverTimestamp()
                  }, { merge: true });
                }

                const finalStatus = command === 'approve' ? 'approved' : 'rejected';
                transaction.update(requestRef, {
                  id: requestId,
                  requestId,
                  generation,
                  organizationId,
                  requesterUid,
                  status: finalStatus,
                  resolvedAt: FieldValue.serverTimestamp(),
                  resolvedByUid: actorUid,
                  updatedAt: FieldValue.serverTimestamp()
                });
                transaction.set(db.doc(`organizations/${organizationId}/audit_logs/join_request_${requestId}_g${generation}_${finalStatus}`), {
                  action: `join_request.${finalStatus}`,
                  actorUid,
                  requestId,
                  requestGeneration: generation,
                  requesterUid,
                  timestamp: FieldValue.serverTimestamp()
                });
                return { success: true, reasonCode: command === 'approve' ? 'JOIN_REQUEST_APPROVED' : 'JOIN_REQUEST_REJECTED', generation };
              });
              if (!result.success) return res.status(statusFor(result.reasonCode)).json({ success: false, reasonCode: result.reasonCode });
              return res.status(200).json(result);
            } catch {
              return res.status(500).json({ success: false, reasonCode: 'INTERNAL_ERROR' });
            }
          }

          export const approveJoinRequest = (req: Request, res: Response, dependencies: Dependencies = {}) =>
            resolveJoinRequest(req, res, 'approve', dependencies);

          export const rejectJoinRequest = (req: Request, res: Response, dependencies: Dependencies = {}) =>
            resolveJoinRequest(req, res, 'reject', dependencies);
          EOF

          cat > scripts/test_p0_join_request_commands_certification.ts <<'EOF'
          import { approveJoinRequest, createJoinRequest, rejectJoinRequest } from '../src/server/services/JoinRequestCommandService.js';
          import { clearInvitationEmulator, createAssertions, invokeHandler, requireInvitationEmulator } from './helpers/p0HandlerTestHarness.js';

          const db = requireInvitationEmulator();
          const { assert, finish } = createAssertions();
          type Identity = { uid: string; email: string; displayName?: string; photoURL?: string };
          const identities = new Map<string, Identity>();
          const verifyIdToken = async (token: string) => {
            const identity = identities.get(token);
            if (!identity) throw new Error('invalid');
            return { uid: identity.uid };
          };
          const getUser = async (uid: string) => {
            const identity = [...identities.values()].find(value => value.uid === uid);
            if (!identity) throw new Error('missing');
            return identity;
          };
          const deps = { verifyIdToken, getUser, getFirestore: () => db, now: () => Date.now() };
          const auth = (token: string, uid: string, email = `${uid}@example.com`) => identities.set(token, { uid, email, displayName: `User ${uid}` });
          const params = (organizationId: string, requestId?: string) => ({ organizationId, ...(requestId ? { requestId } : {}) });
          const create = (token: string | undefined, organizationId: string, body: Record<string, unknown> = {}) =>
            invokeHandler((req, res) => createJoinRequest(req, res, deps), { bearer: token, params: params(organizationId), body });
          const approve = (token: string | undefined, organizationId: string, requestId: string) =>
            invokeHandler((req, res) => approveJoinRequest(req, res, deps), { bearer: token, params: params(organizationId, requestId), body: { uid: 'attacker', organizationRole: 'owner', roleId: 'music' } });
          const reject = (token: string | undefined, organizationId: string, requestId: string) =>
            invokeHandler((req, res) => rejectJoinRequest(req, res, deps), { bearer: token, params: params(organizationId, requestId) });

          async function seedOrg(id: string, status = 'active', plan: 'starter' | 'advanced' | 'pro' = 'starter') {
            const limitUsers = plan === 'starter' ? 10 : plan === 'advanced' ? 20 : -1;
            await Promise.all([
              db.doc(`organizations/${id}`).set({
                id,
                status,
                ownerUid: `${id}-owner`,
                apps: { musicscale: { status: 'active', plan, limits: { users: limitUsers } } }
              }),
              db.doc(`subscriptions/${id}`).set({
                organizationId: id,
                app: 'musicscale',
                status: 'active',
                plan,
                limits: { users: limitUsers }
              })
            ]);
          }

          async function run() {
            await clearInvitationEmulator();
            for (const uid of ['requester', 'requester2', 'member', 'admin', 'owner', 'outsider', 'legacy-owner']) auth(`${uid}-token`, uid);
            await Promise.all([seedOrg('a'), seedOrg('b'), seedOrg('inactive', 'inactive')]);
            await Promise.all([
              db.doc('organizations/a/members/member').set({ uid: 'member', status: 'active', role: 'member' }),
              db.doc('organizations/a/members/admin').set({ uid: 'admin', status: 'active', role: 'admin' }),
              db.doc('organizations/a/members/owner').set({ uid: 'owner', status: 'active', organizationRole: 'owner' }),
              db.doc('organization_members/legacy-owner_a').set({ uid: 'legacy-owner', organizationId: 'a', status: 'active', role: 'owner' })
            ]);

            assert('create without bearer is 401', (await create(undefined, 'a')).statusCode === 401);
            assert('create with invalid bearer is 401', (await create('bad', 'a')).statusCode === 401);
            assert('invalid path organization id is deterministic 400', (await create('requester-token', 'a/b')).statusCode === 400);
            assert('missing organization is denied', (await create('requester-token', 'missing')).statusCode === 404);
            assert('inactive organization is denied', (await create('requester-token', 'inactive')).statusCode === 409);
            const injected = await create('requester-token', 'a', { uid: 'attacker', organizationId: 'b', organizationRole: 'owner', systemRole: 'ceo', musicscaleRole: 'admin' });
            assert('create ignores body authority and uses path/token', injected.statusCode === 201 && injected.body.requestId === 'requester' && injected.body.generation === 1);
            const request = (await db.doc('organizations/a/join_requests/requester').get()).data()!;
            assert('safe canonical request schema excludes injected authority', request.organizationId === 'a' && request.requesterUid === 'requester' && request.status === 'pending' && request.generation === 1 && !request.uid && !request.organizationRole && !request.systemRole && !request.musicscaleRole);
            assert('request keeps admin-visible identity display without authority', request.requesterEmailNormalized === 'requester@example.com' && request.email === 'requester@example.com' && request.displayName === 'User requester');
            assert('create does not create membership or active context', !(await db.doc('organizations/a/members/requester').get()).exists && !(await db.doc('users/requester').get()).exists);
            const duplicates = await Promise.all(Array.from({ length: 8 }, () => create('requester-token', 'a')));
            assert('concurrent duplicate create is deterministic', duplicates.every(result => result.statusCode === 200 && result.body.reasonCode === 'ALREADY_PENDING' && result.body.generation === 1));
            assert('duplicate pending leaves one request and one generation creation audit', (await db.collection('organizations/a/join_requests').get()).size === 1 && (await db.collection('organizations/a/audit_logs').where('action', '==', 'join_request.created').where('requestId', '==', 'requester').get()).size === 1);
            await db.doc('organizations/b/members/requester2').set({ uid: 'requester2', status: 'active', role: 'member' });
            assert('already canonical member is idempotent', (await create('requester2-token', 'b')).body.reasonCode === 'ALREADY_MEMBER');

            auth('suspended-token', 'suspended');
            await db.doc('organizations/a/members/suspended').set({ uid: 'suspended', status: 'suspended', role: 'member' });
            const suspendedCreate = await create('suspended-token', 'a');
            assert('inactive canonical membership cannot create reactivation request', suspendedCreate.statusCode === 409 && suspendedCreate.body.reasonCode === 'MEMBERSHIP_INACTIVE' && !(await db.doc('organizations/a/join_requests/suspended').get()).exists);

            assert('approve without auth is 401', (await approve(undefined, 'a', 'requester')).statusCode === 401);
            assert('common member cannot approve', (await approve('member-token', 'a', 'requester')).statusCode === 403);
            assert('legacy-only owner cannot approve', (await approve('legacy-owner-token', 'a', 'requester')).statusCode === 403);
            assert('cross-tenant request is not resolved', (await approve('admin-token', 'b', 'requester')).statusCode === 403);
            for (const role of ['admin', 'global_support', 'ecosystem_support']) {
              const uid = `global-${role}`; auth(`${uid}-token`, uid); await db.doc(`users/${uid}`).set({ systemRole: role });
              assert(`systemRole ${role} is denied`, (await approve(`${uid}-token`, 'a', 'requester')).statusCode === 403);
            }
            for (const role of ['ceo', 'global_admin', 'ecosystem_owner', 'founder']) {
              const uid = `global-${role}`; auth(`${uid}-token`, uid); await db.doc(`users/${uid}`).set({ systemRole: role });
              await db.doc(`organizations/a/join_requests/global-test-${role}`).set({ id: `global-test-${role}`, requestId: `global-test-${role}`, organizationId: 'a', requesterUid: `global-test-${role}`, status: 'pending', generation: 1 });
              assert(`${role} has exact global resolution authority`, (await reject(`${uid}-token`, 'a', `global-test-${role}`)).statusCode === 200);
            }

            const race = await Promise.all(Array.from({ length: 8 }, () => approve('admin-token', 'a', 'requester')));
            assert('concurrent approve succeeds idempotently', race.every(result => result.statusCode === 200));
            const [membership, legacy, user, resolved] = await Promise.all([
              db.doc('organizations/a/members/requester').get(), db.doc('organization_members/requester_a').get(),
              db.doc('users/requester').get(), db.doc('organizations/a/join_requests/requester').get()
            ]);
            assert('approve creates exactly canonical member role member', membership.exists && membership.data()?.role === 'member' && membership.data()?.organizationRole === 'member' && membership.data()?.status === 'active');
            assert('membership contains no MusicScale role fields', !membership.data()?.roleId && !membership.data()?.musicscaleRole && !membership.data()?.ministryFunction && !membership.data()?.specialtyIds && !membership.data()?.appRole);
            assert('legacy is projection with minimum member role', legacy.exists && legacy.data()?.role === 'member' && !legacy.data()?.roleId && !legacy.data()?.musicscaleRole);
            assert('user context is linked without body authority', user.data()?.organizations.includes('a') && user.data()?.activeOrganizationId === 'a' && user.data()?.primaryOrganizationId === 'a');
            assert('request is approved by server actor', resolved.data()?.status === 'approved' && resolved.data()?.resolvedByUid === 'admin' && resolved.data()?.generation === 1);
            assert('approve emits exactly one resolution audit', (await db.collection('organizations/a/audit_logs').where('action', '==', 'join_request.approved').where('requestId', '==', 'requester').get()).size === 1);
            assert('approved cannot be rejected', (await reject('owner-token', 'a', 'requester')).body.reasonCode === 'APPROVED_CANNOT_BE_REJECTED');

            auth('inactive-target-token', 'inactive-target');
            await Promise.all([
              db.doc('organizations/a/members/inactive-target').set({ uid: 'inactive-target', status: 'removed', role: 'member' }),
              db.doc('organizations/a/join_requests/inactive-target').set({ requesterUid: 'inactive-target', organizationId: 'a', status: 'pending', generation: 1 })
            ]);
            const inactiveApprove = await approve('admin-token', 'a', 'inactive-target');
            assert('approve cannot reactivate removed membership', inactiveApprove.statusCode === 409 && inactiveApprove.body.reasonCode === 'MEMBERSHIP_INACTIVE' && (await db.doc('organizations/a/members/inactive-target').get()).data()?.status === 'removed' && (await db.doc('organizations/a/join_requests/inactive-target').get()).data()?.status === 'pending');

            await create('requester2-token', 'a');
            const rejectRace = await Promise.all(Array.from({ length: 8 }, () => reject('b-owner-token', 'a', 'requester2')));
            assert('unregistered owner token is unauthenticated', rejectRace.every(result => result.statusCode === 401));
            auth('a-owner-token', 'a-owner');
            const resolvedRejectRace = await Promise.all(Array.from({ length: 8 }, () => reject('a-owner-token', 'a', 'requester2')));
            assert('organization metadata owner resolves reject idempotently', resolvedRejectRace.every(result => result.statusCode === 200));
            assert('reject creates no membership in target tenant', !(await db.doc('organizations/a/members/requester2').get()).exists);
            assert('reject emits one audit and replay emits none', (await db.collection('organizations/a/audit_logs').where('action', '==', 'join_request.rejected').where('requestId', '==', 'requester2').get()).size === 1 && (await reject('a-owner-token', 'a', 'requester2')).body.reasonCode === 'ALREADY_REJECTED');

            auth('reapply-token', 'reapply');
            await create('reapply-token', 'a');
            await reject('admin-token', 'a', 'reapply');
            const secondRequest = await create('reapply-token', 'a');
            assert('new request after rejection advances generation', secondRequest.statusCode === 201 && secondRequest.body.generation === 2 && (await db.doc('organizations/a/join_requests/reapply').get()).data()?.generation === 2);
            await reject('admin-token', 'a', 'reapply');
            const reapplyRejectAudits = await db.collection('organizations/a/audit_logs').where('action', '==', 'join_request.rejected').where('requestId', '==', 'reapply').get();
            const reapplyCreateAudits = await db.collection('organizations/a/audit_logs').where('action', '==', 'join_request.created').where('requestId', '==', 'reapply').get();
            assert('request generations preserve independent creation and rejection audit history', reapplyRejectAudits.size === 2 && reapplyCreateAudits.size === 2);

            await seedOrg('full');
            auth('full-admin-token', 'full-admin'); auth('full-requester-token', 'full-requester');
            await db.doc('organizations/full/members/full-admin').set({ uid: 'full-admin', status: 'active', role: 'admin' });
            for (let i = 0; i < 9; i++) await db.doc(`organizations/full/members/m${i}`).set({ uid: `m${i}`, status: 'active', role: 'member' });
            await create('full-requester-token', 'full');
            const fullApproval = await approve('full-admin-token', 'full', 'full-requester');
            assert('join approval cannot bypass canonical member limit', fullApproval.statusCode === 409 && fullApproval.body.reasonCode === 'MEMBER_LIMIT_REACHED' && !(await db.doc('organizations/full/members/full-requester').get()).exists && (await db.doc('organizations/full/join_requests/full-requester').get()).data()?.status === 'pending');

            await seedOrg('reserved');
            auth('reserved-admin-token', 'reserved-admin'); auth('reserved-requester-token', 'reserved-requester');
            await db.doc('organizations/reserved/members/reserved-admin').set({ uid: 'reserved-admin', status: 'active', role: 'admin' });
            for (let i = 0; i < 8; i++) await db.doc(`organizations/reserved/members/r${i}`).set({ uid: `r${i}`, status: 'active', role: 'member' });
            await db.doc('organizations/reserved/invites/pending-slot').set({ status: 'pending', emailNormalized: 'pending@example.com', expiresAt: new Date(Date.now() + 3600000), maxUses: 1, useCount: 0 });
            await create('reserved-requester-token', 'reserved');
            const reservedApproval = await approve('reserved-admin-token', 'reserved', 'reserved-requester');
            assert('pending canonical invitation reserves a limited-plan slot', reservedApproval.statusCode === 409 && reservedApproval.body.reasonCode === 'MEMBER_LIMIT_REACHED' && !(await db.doc('organizations/reserved/members/reserved-requester').get()).exists);

            await seedOrg('no-capacity');
            auth('no-capacity-admin-token', 'no-capacity-admin'); auth('no-capacity-requester-token', 'no-capacity-requester');
            await db.doc('organizations/no-capacity/members/no-capacity-admin').set({ uid: 'no-capacity-admin', status: 'active', role: 'admin' });
            await db.doc('subscriptions/no-capacity').delete();
            await create('no-capacity-requester-token', 'no-capacity');
            const unavailableCapacity = await approve('no-capacity-admin-token', 'no-capacity', 'no-capacity-requester');
            assert('unavailable canonical capacity fails closed', unavailableCapacity.statusCode === 503 && unavailableCapacity.body.reasonCode === 'MEMBER_LIMIT_UNAVAILABLE' && !(await db.doc('organizations/no-capacity/members/no-capacity-requester').get()).exists);

            auth('race-user-token', 'race-user'); auth('race-actor-token', 'race-actor');
            await db.doc('organizations/a/members/race-actor').set({ uid: 'race-actor', status: 'active', role: 'admin' });
            await create('race-user-token', 'a');
            const resolutionRace = await Promise.all([approve('race-actor-token', 'a', 'race-user'), reject('race-actor-token', 'a', 'race-user')]);
            const finalRequest = (await db.doc('organizations/a/join_requests/race-user').get()).data()!;
            const finalMember = await db.doc('organizations/a/members/race-user').get();
            const raceAudits = await db.collection('organizations/a/audit_logs').where('requestId', '==', 'race-user').get();
            assert('approve-vs-reject has one winner', resolutionRace.filter(result => result.body.success === true).length === 1);
            assert('race never leaves active membership with rejected request', !(finalRequest.status === 'rejected' && finalMember.exists));
            assert('race emits one compatible resolution audit', raceAudits.docs.filter(doc => String(doc.data().action).startsWith('join_request.') && doc.data().action !== 'join_request.created').length === 1);

            finish();
          }

          run().catch(error => { console.error(error); process.exitCode = 1; });
          EOF

          cat > tests/firestore/join_requests.rules.test.ts <<'EOF'
          import { after, before, test } from 'node:test';
          import { assertFails, assertSucceeds, initializeTestEnvironment, type RulesTestEnvironment } from '@firebase/rules-unit-testing';
          import { collection, deleteDoc, doc, getDoc, getDocs, setDoc, updateDoc } from 'firebase/firestore';
          import { readFile } from 'node:fs/promises';

          let env: RulesTestEnvironment;
          before(async () => {
            env = await initializeTestEnvironment({
              projectId: 'demo-millionsnest-rules-p0',
              firestore: { host: '127.0.0.1', port: 8080, rules: await readFile('firestore.rules', 'utf8') }
            });
            await env.withSecurityRulesDisabled(async context => {
              const db = context.firestore();
              await Promise.all([
                setDoc(doc(db, 'organizations/a'), { status: 'active' }),
                setDoc(doc(db, 'organizations/b'), { status: 'active' }),
                setDoc(doc(db, 'users/admin'), { systemRole: 'user' }),
                setDoc(doc(db, 'users/member'), { systemRole: 'user' }),
                setDoc(doc(db, 'users/requester'), { systemRole: 'user' }),
                setDoc(doc(db, 'users/ceo'), { systemRole: 'ceo' }),
                setDoc(doc(db, 'users/system-admin'), { systemRole: 'admin' }),
                setDoc(doc(db, 'users/global-support'), { systemRole: 'global_support' }),
                setDoc(doc(db, 'organizations/a/members/admin'), { uid: 'admin', status: 'active', role: 'admin' }),
                setDoc(doc(db, 'organizations/a/members/member'), { uid: 'member', status: 'active', role: 'member' }),
                setDoc(doc(db, 'organizations/a/join_requests/requester'), { requesterUid: 'requester', organizationId: 'a', status: 'pending' })
              ]);
            });
          });
          after(async () => env.cleanup());

          for (const uid of ['admin', 'member', 'requester', 'ceo']) {
            test(`${uid} cannot directly create, update, or delete join requests`, async () => {
              const db = env.authenticatedContext(uid).firestore();
              await assertFails(setDoc(doc(db, 'organizations/a/join_requests/new'), { status: 'pending' }));
              await assertFails(updateDoc(doc(db, 'organizations/a/join_requests/requester'), { status: 'approved' }));
              await assertFails(deleteDoc(doc(db, 'organizations/a/join_requests/requester')));
            });
          }

          test('canonical organization admin can read and list tenant requests', async () => {
            const db = env.authenticatedContext('admin').firestore();
            await assertSucceeds(getDoc(doc(db, 'organizations/a/join_requests/requester')));
            await assertSucceeds(getDocs(collection(db, 'organizations/a/join_requests')));
          });

          test('exact canonical global can read and list but cannot mutate', async () => {
            const db = env.authenticatedContext('ceo').firestore();
            await assertSucceeds(getDoc(doc(db, 'organizations/a/join_requests/requester')));
            await assertSucceeds(getDocs(collection(db, 'organizations/a/join_requests')));
          });

          test('common member, requester, unauthenticated, and cross-tenant actors cannot read request', async () => {
            await assertFails(getDoc(doc(env.authenticatedContext('member').firestore(), 'organizations/a/join_requests/requester')));
            await assertFails(getDoc(doc(env.authenticatedContext('requester').firestore(), 'organizations/a/join_requests/requester')));
            await assertFails(getDoc(doc(env.authenticatedContext('outsider').firestore(), 'organizations/a/join_requests/requester')));
            await assertFails(getDoc(doc(env.unauthenticatedContext().firestore(), 'organizations/a/join_requests/requester')));
          });

          test('noncanonical system admin/support roles cannot read join requests', async () => {
            await assertFails(getDoc(doc(env.authenticatedContext('system-admin').firestore(), 'organizations/a/join_requests/requester')));
            await assertFails(getDoc(doc(env.authenticatedContext('global-support').firestore(), 'organizations/a/join_requests/requester')));
          });
          EOF

