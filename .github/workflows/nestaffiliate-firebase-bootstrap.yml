name: Bootstrap NestAffiliate Firebase Access

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/nestaffiliate-firebase-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestaffiliate-firebase-bootstrap-production
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  PROJECT_NUMBER: "555464791734"
  POOL_ID: mn-prod-github
  PROVIDER_ID: github
  NESTAFFILIATE_REPOSITORY: prdanielcunha/NestAffiliate
  WEB_DEPLOYER: mn-web-deployer@millionsnest.iam.gserviceaccount.com
  FIREBASE_SITE: mn-nestaffiliate-555464791734
  LIVE_DOMAIN: nestaffiliate.millionsnest.com

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Authorize NestAffiliate branches in WIF
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --workload-identity-pool="$POOL_ID" \
            --location=global \
            --project="$PROJECT_ID" \
            --format='value(attributeCondition)')"
          test -n "$CURRENT"
          if grep -Fq "$NESTAFFILIATE_REPOSITORY" <<<"$CURRENT"; then
            echo "NESTAFFILIATE_REPOSITORY_ALREADY_ALLOWED=true"
          else
            CLAUSE="(assertion.repository == '$NESTAFFILIATE_REPOSITORY' && (assertion.ref == 'refs/heads/main' || assertion.ref == 'refs/heads/production'))"
            gcloud iam workload-identity-pools providers update-oidc "$PROVIDER_ID" \
              --workload-identity-pool="$POOL_ID" \
              --location=global \
              --project="$PROJECT_ID" \
              --attribute-condition="($CURRENT) || $CLAUSE" \
              --quiet
            echo "NESTAFFILIATE_REPOSITORY_ADDED=true"
          fi

      - name: Grant least-privilege deploy impersonation
        shell: bash
        run: |
          set -euo pipefail
          MEMBER="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL_ID/attribute.repository/$NESTAFFILIATE_REPOSITORY"
          gcloud iam service-accounts add-iam-policy-binding "$WEB_DEPLOYER" \
            --project="$PROJECT_ID" \
            --role="roles/iam.workloadIdentityUser" \
            --member="$MEMBER" \
            --quiet >/tmp/nestaffiliate-binding.json
          echo "NESTAFFILIATE_WEB_DEPLOYER_BINDING_READY=true"

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.26.0

      - name: Ensure dedicated Hosting site
        shell: bash
        run: |
          set -euo pipefail
          if firebase hosting:sites:list --project "$PROJECT_ID" | grep -Fq "$FIREBASE_SITE"; then
            echo "HOSTING_SITE_EXISTS=$FIREBASE_SITE"
          else
            firebase hosting:sites:create "$FIREBASE_SITE" --project "$PROJECT_ID"
            echo "HOSTING_SITE_CREATED=$FIREBASE_SITE"
          fi

      - name: Authorize Firebase Authentication domains
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          CONFIG="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config")"
          FALLBACK_DOMAIN="$FIREBASE_SITE.web.app"
          DOMAINS="$(jq -c --arg live "$LIVE_DOMAIN" --arg fallback "$FALLBACK_DOMAIN" \
            '.authorizedDomains + [$live, $fallback] | unique' <<<"$CONFIG")"
          jq -n --argjson domains "$DOMAINS" '{authorizedDomains:$domains}' >/tmp/nestaffiliate-auth.json
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/nestaffiliate-auth.json \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config?updateMask=authorizedDomains" \
            >/dev/null
          echo "NESTAFFILIATE_AUTH_DOMAINS_READY=true"

      - name: Ensure Firebase custom domain
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$FIREBASE_SITE/customDomains"
          STATUS="$(curl --silent --show-error --output /tmp/nestaffiliate-domain.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$BASE/$LIVE_DOMAIN")"
          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci","product":"nestaffiliate"}}' \
              "$BASE?customDomainId=$LIVE_DOMAIN" >/tmp/nestaffiliate-domain-create.json
            echo "NESTAFFILIATE_CUSTOM_DOMAIN_CREATED=true"
          elif [ "$STATUS" = "200" ]; then
            echo "NESTAFFILIATE_CUSTOM_DOMAIN_EXISTS=true"
          else
            cat /tmp/nestaffiliate-domain.json
            exit 1
          fi

      - name: Read Firebase DNS requirements
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$FIREBASE_SITE/customDomains/$LIVE_DOMAIN"
          for attempt in $(seq 1 5); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "$URL" >/tmp/nestaffiliate-domain.json; then
              break
            fi
            sleep 2
          done

          jq -r --arg domain "$LIVE_DOMAIN" '
            [
              (.requiredDnsUpdates.desired[]?),
              (.cert.verification.dns.desired[]?)
            ]
            | unique_by([.domainName, .type, .rdata])
            | .[]
            | [(.domainName | rtrimstr(".")), .type, (.rdata | tostring | gsub("^\\\"|\\\"$"; "") | rtrimstr("."))]
            | @tsv
          ' /tmp/nestaffiliate-domain.json >/tmp/nestaffiliate-dns.tsv

          jq '{ownershipState,hostState,reconciling,certState:(.cert.state // null)}' /tmp/nestaffiliate-domain.json

      - name: Apply only NestAffiliate DNS records
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/nestaffiliate-dns.tsv ]; then
            echo "NESTAFFILIATE_DNS_NO_CHANGES=true"
            exit 0
          fi

          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$PROJECT_ID")"
          echo "::add-mask::$CF_TOKEN"
          ZONES="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS="$(printf '\\t')" read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue
            case "$NAME" in
              "$LIVE_DOMAIN"|*."$LIVE_DOMAIN") ;;
              *) echo "Refusing out-of-scope DNS mutation: $NAME"; exit 1 ;;
            esac

            EXISTING="$(curl --fail --silent --show-error -G \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-urlencode "name=$NAME" \
              --data-urlencode "type=$TYPE" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"
            MATCH_ID="$(jq -r --arg value "$VALUE" '.result[] | select(.content == $value) | .id' <<<"$EXISTING" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE" \
              '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"
            RECORD_ID="$(jq -r '.result[0].id // empty' <<<"$EXISTING")"
            if [ -n "$RECORD_ID" ] && [ "$TYPE" != "TXT" ]; then
              curl --fail --silent --show-error -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" >/dev/null
            else
              curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            fi
            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/nestaffiliate-dns.tsv

      - name: Verify infrastructure contract
        shell: bash
        run: |
          set -euo pipefail
          CONDITION="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --workload-identity-pool="$POOL_ID" \
            --location=global \
            --project="$PROJECT_ID" \
            --format='value(attributeCondition)')"
          grep -F "$NESTAFFILIATE_REPOSITORY" <<<"$CONDITION" >/dev/null
          firebase hosting:sites:list --project "$PROJECT_ID" | grep -F "$FIREBASE_SITE" >/dev/null
          echo "NESTAFFILIATE_FIREBASE_BOOTSTRAP_OK=true"
