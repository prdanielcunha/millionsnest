# Publish the assisted MusicScale first-access trial recovery using the existing Hosting pipeline.
# Triggered only when this workflow file is first merged into production.
name: Hub Firebase Site Release - Assisted Trial

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/hub-firebase-site-release-20261022.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: millionsnest-hub-firebase-hosting-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact approved revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate marketing, permissions and site build
        run: |
          set -euo pipefail
          npm run lint
          node --import tsx scripts/test_musicscale_first_access_trial.ts
          node --import tsx scripts/test_nestfinance_approved_brand.ts
          npx tsx scripts/test_public_home_funnel.ts
          npx tsx scripts/test_musicscale_sales_truth.ts
          npx tsx scripts/test_firebase_hosting_cloudrun_policy.ts

      - name: Build public web application
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
          VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: millionsnest
          VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
          VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"
          VITE_APP_URL: https://www.millionsnest.com
          VITE_MUSICSCALE_APP_URL: https://musicscale.millionsnest.com/start
          VITE_NESTFINANCE_LAUNCH_ENABLED: "true"
        run: npm run build

      - name: Exclude server-only bundle from public Hosting
        run: |
          set -euo pipefail
          test -f dist/index.html
          rm -f dist/server.cjs

      - name: Authenticate to production Firebase via workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Wait for the matching Hub API before publishing its entry screen
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            RESULT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cloudrun-private-deploy.yml/runs?head_sha=${EXPECTED_SHA}&branch=production&per_page=20" --jq '[.workflow_runs[] | select(.head_branch == "production")] | sort_by(.run_number) | reverse | .[0] | if . == null then "pending" else (.status + " " + (.conclusion // "pending")) end')"
            if [ "$RESULT" = 'completed success' ]; then
              STATUS="$(curl --silent --show-error --max-time 30 -o /tmp/hub-first-access-smoke.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' https://www.millionsnest.com/api/v1/billing/trial/first-access)"
              test "$STATUS" = '401'
              echo HUB_FIRST_ACCESS_API_AUTH_BOUNDARY_READY
              exit 0
            fi
            case "$RESULT" in
              'completed '*) echo "Matching API deployment did not succeed." >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Matching API deployment was not confirmed; keeping existing Hosting." >&2
          exit 1

      - name: Publish ONLY Hub Firebase Hosting (no database, Rules, Stripe or Functions)
        run: ./node_modules/.bin/firebase deploy --only hosting:hub --project millionsnest --non-interactive

      - name: Verify public routes after publication
        shell: bash
        run: |
          set -euo pipefail
          for PAGE in / /musicscale; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "https://www.millionsnest.com${PAGE}" -o /tmp/hub-release-page.html
            grep -Eiq '<!doctype html|<html' /tmp/hub-release-page.html
          done
          echo "HUB_MARKETING_FIREBASE_PUBLISHED"

      - name: Verify approved NestFinance symbol bytes on canonical site
        run: |
          set -euo pipefail
          ASSET=brand/nestfinance/nf-continuous/v2/symbols/nestfinance-gradient.svg
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "https://www.millionsnest.com/$ASSET" -o /tmp/hub-approved-nf.svg
          cmp "public/$ASSET" /tmp/hub-approved-nf.svg

