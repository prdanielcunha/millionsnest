name: Action OS Slice 1 CI

on:
  push:
    branches:
      - feature/action-os-slice1-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-os-slice1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1f9a3c9efcbd696b7de65a720a # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck
        run: npm run lint

      - name: Action OS deterministic projection
        run: npx tsx scripts/test_action_center_projection.ts

      - name: Hub zero-knowledge customer UX
        run: npx tsx scripts/test_hub_zero_knowledge_ux.ts

      - name: Premium multi-app Hub responsive contract
        run: npx tsx scripts/test_premium_multi_app_hub.ts

      - name: Hub narrow viewport polish
        run: npx tsx scripts/test_hub_narrow_viewports.ts

      - name: Complete central Hub contract
        run: npx tsx scripts/test_complete_central_hub.ts

      - name: Build
        run: npm run build
