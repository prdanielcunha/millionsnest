name: Patch Admin Organization Selector Truth Once

on:
  push:
    branches:
      - fix/admin-org-selector-truth-01
    paths:
      - '.github/workflows/patch-admin-org-selector-truth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/admin-org-selector-truth-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact selector patch and remove temporary patch machinery
        run: |
          set -euo pipefail
          node scripts/patch_admin_org_selector_truth.mjs
          git rm scripts/patch_admin_org_selector_truth.mjs .github/workflows/patch-admin-org-selector-truth-once.yml
          git add src/components/OrganizationManager.tsx src/lib/adminOrganizationSelector.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix global-admin organization selector truth'
          git push origin HEAD:fix/admin-org-selector-truth-01
