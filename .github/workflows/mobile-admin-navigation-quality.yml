name: MillionsNest Mobile Admin Navigation QA
on:
  pull_request:
    branches: [main, production]
    paths:
      - 'src/App.tsx'
      - 'src/components/EcosystemShell.tsx'
      - 'src/pages/EcosystemAdmin.tsx'
      - 'scripts/test_admin_mobile_navigation.ts'
      - '.github/workflows/mobile-admin-navigation-quality.yml'
  push:
    branches: [main, production]
    paths:
      - 'src/App.tsx'
      - 'src/components/EcosystemShell.tsx'
      - 'src/pages/EcosystemAdmin.tsx'
      - 'scripts/test_admin_mobile_navigation.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: CEO and global admin mobile navigation contract
        run: node --import tsx scripts/test_admin_mobile_navigation.ts
      - name: TypeScript
        run: npm run lint
      - name: Bundle
        run: npm run build
