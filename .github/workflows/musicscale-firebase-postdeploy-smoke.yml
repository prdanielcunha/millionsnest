name: MusicScale Firebase Postdeploy Smoke

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/musicscale-firebase-postdeploy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Wait for Hosting propagation
        run: sleep 15

      - name: Smoke MusicScale SPA with propagation retries
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mn-musicscale-555464791734.web.app"
          curl --fail --silent --show-error --location             --retry 12 --retry-delay 3 --retry-all-errors             "$BASE/" -o /tmp/ms-index.html
          grep -Eiq '<!doctype html|<html' /tmp/ms-index.html
          echo "MUSICSCALE_FIREBASE_SPA_OK"

      - name: Smoke API rewrite without mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mn-musicscale-555464791734.web.app"
          for i in {1..12}; do
            STATUS="$(curl --silent --show-error --location               -o /tmp/ms-access.json -w '%{http_code}'               "$BASE/api/v1/ecosystem/access-context?organizationId=staging-smoke" || true)"
            if [ "$STATUS" = "401" ]; then
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/ms-access.json','utf8'));if(!String(x.error||'').toLowerCase().includes('unauthorized'))process.exit(1);"
              echo "MUSICSCALE_FIREBASE_API_AUTH_BOUNDARY_OK"
              exit 0
            fi
            echo "Attempt $i returned HTTP $STATUS"
            sleep 3
          done
          cat /tmp/ms-access.json || true
          exit 1

      - name: Verify runtime secret bindings without values
        run: |
          gcloud run services describe musicscale-api             --project millionsnest             --region us-central1             --format='yaml(spec.template.spec.containers[0].env)' > /tmp/ms-env.yaml
          grep -q "musicscale-gemini-api-key" /tmp/ms-env.yaml
          grep -q "musicscale-stripe-secret-key" /tmp/ms-env.yaml
          echo "MUSICSCALE_RUNTIME_SECRET_BINDINGS_OK"
