name: Ecosystem Domains SSO QA

on:
  pull_request:
    branches: [production]
    paths:
      - 'src/lib/apps.ts'
      - 'src/lib/appExperienceRegistry.ts'
      - 'src/lib/connectLaunchPolicy.ts'
      - 'src/lib/ecosystemLauncher.ts'
      - 'src/pages/EcosystemAppLaunch.tsx'
      - 'src/pages/Login.tsx'
      - 'src/server/services/EcosystemAccessResolver.ts'
      - 'src/server/services/MusicScaleHandoffService.ts'
      - 'scripts/test_ecosystem_domains_sso_contract.ts'
      - 'docs/ECOSYSTEM_DOMAINS_SSO.md'
      - '.github/workflows/ecosystem-domains-sso-qa.yml'
  push:
    branches: [production]
    paths:
      - 'src/lib/apps.ts'
      - 'src/lib/appExperienceRegistry.ts'
      - 'src/lib/connectLaunchPolicy.ts'
      - 'src/lib/ecosystemLauncher.ts'
      - 'src/pages/EcosystemAppLaunch.tsx'
      - 'src/pages/Login.tsx'
      - 'src/server/services/EcosystemAccessResolver.ts'
      - 'src/server/services/MusicScaleHandoffService.ts'
      - 'scripts/test_ecosystem_domains_sso_contract.ts'
      - '.github/workflows/ecosystem-domains-sso-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Ecosystem domain and SSO contract
        run: npx tsx scripts/test_ecosystem_domains_sso_contract.ts
      - name: Build
        run: npm run build
