name: NestAI Web App Check Bootstrap
on:
  push:
    branches: ["production"]
    paths:
      - ".github/workflows/nestai-console-appcheck-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate as MillionsNest Infra Admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Provision shared NestAI App Check
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="millionsnest"
          PROJECT_NUMBER="555464791734"
          FIREBASE_APP_ID="1:555464791734:web:3059e8ac2b8089a1767817"
          DISPLAY_NAME="NestAI Console App Check"
          DOMAINS="ai.millionsnest.com,nestlume.millionsnest.com"

          gcloud config set project "$PROJECT_ID"

          for ROLE in roles/recaptchaenterprise.admin roles/firebaseappcheck.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID"               --member="serviceAccount:mn-infra-admin@millionsnest.iam.gserviceaccount.com"               --role="$ROLE"               --condition=None               --quiet >/dev/null
          done

          gcloud services enable recaptchaenterprise.googleapis.com firebaseappcheck.googleapis.com --project="$PROJECT_ID"

          SITE_KEY="$(gcloud recaptcha keys list             --project="$PROJECT_ID"             --filter="displayName='$DISPLAY_NAME'"             --format='value(name.basename())'             --limit=1)"

          if [ -z "$SITE_KEY" ]; then
            SITE_KEY="$(gcloud recaptcha keys create               --project="$PROJECT_ID"               --web               --display-name="$DISPLAY_NAME"               --integration-type=score               --domains="$DOMAINS"               --format='value(name.basename())')"
            echo "NESTAI_APPCHECK_KEY_CREATED=true"
          else
            gcloud recaptcha keys update "$SITE_KEY"               --project="$PROJECT_ID"               --web               --domains="$DOMAINS"               --quiet >/dev/null
            echo "NESTAI_APPCHECK_KEY_REUSED=true"
          fi

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          RESOURCE="projects/$PROJECT_NUMBER/apps/$FIREBASE_APP_ID/recaptchaEnterpriseConfig"
          BODY="$(node -e 'const [name,siteKey]=process.argv.slice(1); process.stdout.write(JSON.stringify({name,siteKey,tokenTtl:"604800s",riskAnalysis:{minValidScore:0.5}}))' "$RESOURCE" "$SITE_KEY")"

          curl --fail --silent --show-error             -X PATCH             -H "Authorization: Bearer $ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$BODY"             "https://firebaseappcheck.googleapis.com/v1/$RESOURCE?updateMask=siteKey,tokenTtl,riskAnalysis"             >/tmp/appcheck.json

          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/appcheck.json","utf8"));if(!x.siteKey)process.exit(1);console.log("NESTAI_APPCHECK_REGISTERED=true");console.log("NESTAI_APPCHECK_SITE_KEY="+x.siteKey);console.log("NESTAI_APPCHECK_TOKEN_TTL="+x.tokenTtl);'
