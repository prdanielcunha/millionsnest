name: NestFinance canonical gateway storage QA
on:
  pull_request:
    branches: [main, production]
    paths:
      - 'firestore.rules'
      - 'tests/firestore/nestfinance_gateway_storage.test.ts'
      - '.github/workflows/nestfinance-gateway-storage-qa.yml'
  push:
    branches: [main, production]
    paths:
      - 'firestore.rules'
      - 'tests/firestore/nestfinance_gateway_storage.test.ts'
      - '.github/workflows/nestfinance-gateway-storage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: >-
          npx firebase emulators:exec --config firebase.rules-test.json
          --only firestore --project demo-millionsnest-finance-gateway
          "node --import tsx tests/firestore/nestfinance_gateway_storage.test.ts"
