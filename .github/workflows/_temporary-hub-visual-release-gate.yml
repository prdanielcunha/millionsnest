name: Temporary Hub Visual Release Gate Hotfix

on:
  push:
    branches:
      - fix/hub-visual-release-gate

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/hub-visual-release-gate
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/_apply_visual_hotfix.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Narrow viewport regression
        run: npx tsx scripts/test_hub_narrow_viewports.ts

      - name: Visual release structural gate
        run: npx tsx scripts/test_hub_visual_release_gate.ts

      - name: CEO people governance regression
        run: npx tsx scripts/test_ceo_people_governance_contract.ts

      - name: Hub zero-knowledge UX regression
        run: npx tsx scripts/test_hub_zero_knowledge_ux.ts

      - name: Build
        run: npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary-hub-visual-release-gate.yml scripts/_apply_visual_hotfix.py
          git add src/components/OrganizationManager.tsx src/pages/Dashboard.tsx scripts/test_hub_narrow_viewports.ts scripts/test_hub_visual_release_gate.ts .github/workflows/millionsnest-qa.yml docs/DESIGN_LANGUAGE.md docs/MILLIONSNEST_ACTION_OS_BLUEPRINT_2026.md docs/HUB_VISUAL_RELEASE_GATE.md
          git commit -m "fix: harden Hub visual release gate"
          git push origin HEAD:fix/hub-visual-release-gate
