assert.ok(organization.includes('lg:flex-row lg:items-center lg:justify-between'), 'invite/access request rows must wait for a genuinely wide content area before going horizontal');
assert.ok(organization.includes('break-words [overflow-wrap:anywhere]">{invite.email'), 'pending invitation email must wrap naturally');
assert.ok(organization.includes('break-words [overflow-wrap:anywhere]">{req.email || req.id}'), 'join-request identity must wrap naturally');
assert.ok(organization.includes('authoritativeOwnerUid'), 'member role management must distinguish the authoritative owner from stale owner memberships');
assert.ok(organization.includes('getMemberRoleManagementOptions'), 'member role selector must use the canonical management policy');
assert.equal(organization.includes('<option value="leader">'), false, 'member role selector must not submit legacy leader as an organization role');
