name: Bootstrap NestTuner Official Domain

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/nesttuner-firebase-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nesttuner-official-domain
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  PROJECT_NUMBER: "555464791734"
  POOL_ID: mn-prod-github
  PROVIDER_ID: github
  NESTTUNER_REPOSITORY: prdanielcunha/nesttuner
  WEB_DEPLOYER: mn-web-deployer@millionsnest.iam.gserviceaccount.com
  SITE: mn-nesttuner-555464791734
  DOMAIN: nesttuner.millionsnest.com

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MillionsNest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate as MillionsNest infrastructure admin
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-infra-admin@millionsnest.iam.gserviceaccount.com

      - name: Keep NestTuner main authorized in production WIF
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gcloud iam workload-identity-pools providers describe "$PROVIDER_ID"             --workload-identity-pool="$POOL_ID"             --location=global             --project="$PROJECT_ID"             --format='value(attributeCondition)')"
          test -n "$CURRENT"

          if ! grep -Fq "$NESTTUNER_REPOSITORY" <<<"$CURRENT"; then
            CLAUSE="(assertion.repository == '$NESTTUNER_REPOSITORY' && assertion.ref == 'refs/heads/main')"
            UPDATED="($CURRENT) || $CLAUSE"
            gcloud iam workload-identity-pools providers update-oidc "$PROVIDER_ID"               --workload-identity-pool="$POOL_ID"               --location=global               --project="$PROJECT_ID"               --attribute-condition="$UPDATED"               --quiet
          fi

          MEMBER="principalSet://iam.googleapis.com/projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL_ID/attribute.repository/$NESTTUNER_REPOSITORY"
          gcloud iam service-accounts add-iam-policy-binding "$WEB_DEPLOYER"             --project="$PROJECT_ID"             --role="roles/iam.workloadIdentityUser"             --member="$MEMBER"             --quiet >/tmp/nesttuner-web-deployer-binding.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.1

      - name: Ensure single NestTuner Hosting site
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(firebase hosting:sites:list --project "$PROJECT_ID")"
          if grep -Fq "$SITE" <<<"$EXISTING"; then
            echo "HOSTING_SITE_EXISTS=$SITE"
          else
            firebase hosting:sites:create "$SITE" --project "$PROJECT_ID"
            echo "HOSTING_SITE_CREATED=$SITE"
          fi

      - name: Ensure official NestTuner custom domain
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE/customDomains"
          STATUS="$(curl --silent --output /tmp/domain-get.json --write-out '%{http_code}'             -H "Authorization: Bearer $TOKEN" "$BASE/$DOMAIN")"

          if [ "$STATUS" = "404" ]; then
            curl --fail --silent --show-error -X POST               -H "Authorization: Bearer $TOKEN"               -H "Content-Type: application/json"               -d '{"certPreference":"DEDICATED","annotations":{"managed-by":"millionsnest-ci","product":"nesttuner","canonical":"true"}}'               "$BASE?customDomainId=$DOMAIN" >/tmp/domain-create.json
            echo "CUSTOM_DOMAIN_CREATED=$DOMAIN"
          elif [ "$STATUS" = "200" ]; then
            echo "CUSTOM_DOMAIN_EXISTS=$DOMAIN"
          else
            cat /tmp/domain-get.json >&2
            exit 1
          fi

      - name: Read exact Firebase DNS requirement
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          TOKEN="$(gcloud auth print-access-token)"
          URL="https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites/$SITE/customDomains/$DOMAIN"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$URL" >/tmp/nesttuner-domain.json

          python3 - "$DOMAIN" "$SITE" <<'PY'
          import json, sys
          from pathlib import Path
          domain, site = sys.argv[1:]
          data = json.loads(Path('/tmp/nesttuner-domain.json').read_text())
          desired = list((data.get('requiredDnsUpdates') or {}).get('desired') or [])
          desired += list((((data.get('cert') or {}).get('verification') or {}).get('dns') or {}).get('desired') or [])
          rows, seen = [], set()
          for record in desired:
              name = str(record.get('domainName') or '').rstrip('.')
              typ = str(record.get('type') or '').upper()
              value = str(record.get('rdata') or '').strip().strip('"').rstrip('.')
              key = (name, typ, value)
              if not name or typ not in {'A','AAAA','CNAME','TXT'} or not value or key in seen:
                  continue
              if not (name == domain or name.endswith('.' + domain)):
                  raise SystemExit(f'Out-of-scope DNS name: {name}')
              seen.add(key); rows.append(key)
          if not rows and data.get('hostState') == 'HOST_UNHOSTED':
              rows.append((domain, 'CNAME', f'{site}.web.app'))
          Path('/tmp/nesttuner-dns.tsv').write_text('\n'.join('\t'.join(r) for r in rows) + ('\n' if rows else ''))
          print(json.dumps({
              'domain': domain,
              'ownershipState': data.get('ownershipState'),
              'hostState': data.get('hostState'),
              'certState': (data.get('cert') or {}).get('state'),
              'dnsRecordCount': len(rows)
          }, sort_keys=True))
          PY

      - name: Apply only official NestTuner DNS in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(gcloud secrets versions access latest --secret=mn-cloudflare-dns-token --project="$PROJECT_ID")"
          ZONES="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CF_TOKEN"             'https://api.cloudflare.com/client/v4/zones?name=millionsnest.com&status=active')"
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          while IFS=$'\t' read -r NAME TYPE VALUE; do
            test -n "$NAME" || continue
            case "$NAME" in "$DOMAIN"|*."$DOMAIN") ;; *) echo "Out-of-scope DNS: $NAME" >&2; exit 1 ;; esac

            EXISTING="$(curl --fail --silent --show-error -G               -H "Authorization: Bearer $CF_TOKEN"               --data-urlencode "name=$NAME"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"

            MATCH_ID="$(jq -r --arg type "$TYPE" --arg value "$VALUE"               '.result[] | select(.type == $type and .content == $value) | .id' <<<"$EXISTING" | head -n1)"
            if [ -n "$MATCH_ID" ]; then
              echo "DNS_ALREADY_CORRECT name=$NAME type=$TYPE"
              continue
            fi

            if [ "$TYPE" != "TXT" ]; then
              while read -r RECORD_ID; do
                test -n "$RECORD_ID" || continue
                curl --fail --silent --show-error -X DELETE                   -H "Authorization: Bearer $CF_TOKEN"                   "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" >/dev/null
              done < <(jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$EXISTING")
            fi

            PAYLOAD="$(jq -nc --arg type "$TYPE" --arg name "$NAME" --arg content "$VALUE"               '{type:$type,name:$name,content:$content,ttl:300,proxied:false}')"
            curl --fail --silent --show-error -X POST               -H "Authorization: Bearer $CF_TOKEN"               -H "Content-Type: application/json"               --data "$PAYLOAD"               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" >/dev/null
            echo "DNS_APPLIED name=$NAME type=$TYPE"
          done </tmp/nesttuner-dns.tsv

      - name: Verify official NestTuner infrastructure
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:sites:list --project "$PROJECT_ID" | grep -F "$SITE" >/dev/null
          echo "CNAME:"
          dig +short CNAME "$DOMAIN" || true
          echo "A:"
          dig +short A "$DOMAIN" || true
          echo "AAAA:"
          dig +short AAAA "$DOMAIN" || true
          echo "NESTTUNER_OFFICIAL_DOMAIN_BOOTSTRAP_OK=true"
