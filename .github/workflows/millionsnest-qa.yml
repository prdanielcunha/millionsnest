name: MillionsNest QA

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: millionsnest-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and typecheck
        run: npm run lint

      - name: Security governance contract
        run: npx tsx scripts/test_millionsnest_security_governance_p0.ts

      - name: MusicScale access resolver contract
        run: npx tsx scripts/test_mn_access_01_musicscale_resolver.ts

      - name: MusicScale handoff contract
        run: npx tsx scripts/test_mn_access_02_musicscale_handoff.ts

      - name: MusicScale entitlement hygiene
        run: npx tsx scripts/test_millionsnest_musicscale_entitlement_hygiene.ts

      - name: MusicScale explicit checkout plan contract
        run: npx tsx scripts/test_music_scale_checkout_explicit_plan.ts

      - name: MusicScale one-trial-per-organization contract
        run: npx tsx scripts/test_music_scale_trial_history.ts

      - name: Checkout confirmation tenant-binding contract
        run: npx tsx scripts/test_checkout_confirm_tenant_binding.ts

      - name: Firestore Rules emulator tests
        run: >-
          npx firebase emulators:exec
          --config firebase.rules-test.json
          --only firestore
          --project demo-millionsnest-ci
          "npx tsx --test --test-concurrency=1 tests/firestore/*.test.ts && npx tsx scripts/test_musicscale_live_conductor_rbac.ts"

      - name: Build
        run: npm run build
