name: Firebase Domain Readiness Check
# Certified ecosystem-domain verification: DNS + Firebase state + Auth allowlist + public HTTPS

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/firebase-domain-readiness-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Check TXT propagation
        shell: bash
        run: |
          set -euo pipefail
          check_txt () {
            NAME="$1"
            EXPECTED="$2"
            echo "===== TXT:$NAME ====="
            FOUND="$(dig +short TXT "$NAME" | tr -d '"' || true)"
            echo "$FOUND"
            echo "$FOUND" | grep -F "$EXPECTED" >/dev/null
          }

          check_txt "_acme-challenge.millionsnest.com" "D-OrFu1o2u51z4ArQVTzPYk-LTbtbhZuqdiX6Kq_iW8"
          check_txt "_acme-challenge.www.millionsnest.com" "0ApjIK53ucEDXnOSC490vqTCoN3lf664ZrxvkvcYhSc"
          check_txt "_acme-challenge.musicscale.millionsnest.com" "dHL3KE7LQsm2dST8hjyRxvLS8Y0TxM4872cLR5uino0"
          check_txt "_acme-challenge.nestfinance.millionsnest.com" "Thu4O1SllLxSyXfvDH5B1PUkq5FKUkpwPpVnqbPchXw"
          check_txt "_acme-challenge.connect.millionsnest.com" "0TxsFEGPV2pW9ft-jgUXzeqsshRakE_WmgeXbR1T0Uo"
          check_txt "_acme-challenge.nestjourney.millionsnest.com" "CADK5zgaTg-2BX2BqMWRWAqiBPo2_cHOAZ0OY7JQbWI"
          check_txt "millionsnest.com" "hosting-site=mn-hub-555464791734"

          echo "ALL_REQUIRED_TXT_VISIBLE"

      - name: Require Firebase custom-domain readiness
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"

          require_ready () {
            SITE="$1"
            DOMAIN="$2"
            URL="https://firebasehosting.googleapis.com/v1beta1/projects/millionsnest/sites/$SITE/customDomains/$DOMAIN"
            echo "===== DOMAIN:$DOMAIN ====="
            curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$URL" > /tmp/domain.json
            python3 - "$DOMAIN" <<'PY'
          import json, sys
          domain = sys.argv[1]
          with open('/tmp/domain.json', encoding='utf-8') as f:
              x = json.load(f)
          ownership = x.get('ownershipState')
          host = x.get('hostState')
          cert = (x.get('cert') or {}).get('state')
          reconciling = bool(x.get('reconciling', False))
          issues = x.get('issues', [])
          print(f'ownershipState={ownership}')
          print(f'hostState={host}')
          print(f'certState={cert}')
          print(f'reconciling={reconciling}')
          print('issues='+json.dumps(issues, separators=(',', ':')))
          if ownership != 'OWNERSHIP_ACTIVE' or host != 'HOST_ACTIVE' or cert != 'CERT_ACTIVE':
              raise SystemExit(f'{domain} is not fully ready')
          PY
          }

          require_ready "mn-hub-555464791734" "millionsnest.com"
          require_ready "mn-hub-555464791734" "www.millionsnest.com"
          require_ready "mn-musicscale-555464791734" "musicscale.millionsnest.com"
          require_ready "mn-nestfinance-555464791734" "nestfinance.millionsnest.com"
          require_ready "mn-connect-555464791734" "connect.millionsnest.com"
          require_ready "mn-nestjourney-555464791734" "nestjourney.millionsnest.com"

          echo "ALL_FIREBASE_CUSTOM_DOMAINS_READY"

      - name: Require Firebase Authentication authorized domains
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/millionsnest/config" \
            > /tmp/firebase-auth-config.json

          python3 <<'PY'
          import json
          required = {
              'millionsnest.com',
              'www.millionsnest.com',
              'musicscale.millionsnest.com',
              'nestfinance.millionsnest.com',
              'connect.millionsnest.com',
              'nestjourney.millionsnest.com',
          }
          with open('/tmp/firebase-auth-config.json', encoding='utf-8') as f:
              config = json.load(f)
          actual = set(config.get('authorizedDomains') or [])
          print('authorizedDomains=' + ','.join(sorted(actual)))
          missing = sorted(required - actual)
          if missing:
              raise SystemExit('Missing Firebase Auth authorized domains: ' + ', '.join(missing))
          print('ALL_OFFICIAL_DOMAINS_AUTHORIZED_IN_FIREBASE_AUTH')
          PY

      - name: Public HTTPS smoke for every official domain
        shell: bash
        run: |
          set -euo pipefail
          smoke () {
            DOMAIN="$1"
            echo "===== HTTPS:$DOMAIN ====="
            echo "A=$(dig +short A "$DOMAIN" | tr '\n' ',' | sed 's/,$//')"
            echo "AAAA=$(dig +short AAAA "$DOMAIN" | tr '\n' ',' | sed 's/,$//')"
            STATUS="$(curl --silent --show-error --location --http1.1 --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 --output /tmp/domain-home.html --write-out '%{http_code}' "https://$DOMAIN/")"
            echo "status=$STATUS"
            test "$STATUS" = "200"
            grep -Eiq '<!doctype html|<html' /tmp/domain-home.html
          }

          smoke "millionsnest.com"
          smoke "www.millionsnest.com"
          smoke "musicscale.millionsnest.com"
          smoke "nestfinance.millionsnest.com"
          smoke "connect.millionsnest.com"
          smoke "nestjourney.millionsnest.com"

          echo "ALL_OFFICIAL_DOMAINS_HTTPS_OK"
